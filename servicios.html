<!DOCTYPE HTML PUBLIC "-//W3C//DTD HTML 4.01 Transitional//EN" "http://www.w3.org/TR/html4/loose.dtd">
<html>
<head>
<meta http-equiv="Content-Type" content="text/html; charset=iso-8859-1">
<title>INCOREA CABLES-servicios</title>
<link href="estilos.css" rel="stylesheet" type="text/css">
<style>
    /* Estilos del panel de control */
    .admin-seccion {
        background: rgba(30, 41, 59, 0.4);
        border: 1px dashed rgba(255, 255, 255, 0.1);
        border-radius: 8px;
        padding: 12px 15px;
        margin-bottom: 12px;
    }
    .admin-seccion h5 {
        color: #1abc9c;
        margin-top: 0;
        margin-bottom: 8px;
        font-size: 12px;
        font-weight: 700;
        letter-spacing: 0.5px;
    }
    .input-admin-compacto {
        padding: 8px 12px !important;
        border-radius: 5px !important;
        border: 1px solid rgba(255, 255, 255, 0.06) !important;
        background: #1c2b3a !important;
        color: white !important;
        font-size: 12px !important;
        outline: none;
    }
    .btn-admin-compacto {
        background: linear-gradient(135deg, #1abc9c 0%, #16a085 100%);
        color: white;
        border: none;
        padding: 8px 15px !important;
        border-radius: 5px !important;
        cursor: pointer;
        font-weight: bold;
        font-size: 11px !important;
        transition: all 0.3s ease;
    }
    .btn-admin-compacto:hover {
        background: linear-gradient(135deg, #17d3ad 0%, #1abc9c 100%);
    }
</style>

<script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-app.js"></script>
<script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-database.js"></script>

</head>
<body>
<div id="wrapper">
    <div id="header">
        <div id="logo-container"><img src="logo de la empresa.png" id="logo-imagen" alt="Logo"></div>
        <div id="titulo-container">
            <h1>Calidad que conecta tus proyectos</h1>
            <p>Estamos para ayudarte</p>
        </div>
    </div>
    
    <div id="nav">
        <a href="index.html">INICIO</a>
        <a href="directorio.html">DIRECTORIO</a>
        <a href="servicios.html">SERVICIOS</a>
        <a href="sugerencias.html">SUGERENCIAS</a>
        <a href="comentarios.html">COMENTARIO</a>
    </div>
    
    <div id="hero-slider" class="hero-dinamico">
        <div class="hero-overlay" style="padding: 40px 0;">
            <h2>ADMINISTRACIÓN DE ARCHIVOS</h2>
            <p>CREA CARPETAS Y SUBE ENLACES EN TIEMPO REAL</p>
        </div>
    </div>

    <div id="admin-panel" style="background: rgba(44, 62, 80, 0.3); backdrop-filter: blur(12px); padding: 18px 25px; border-radius: 12px; margin: 40px 5%; border: 1px solid rgba(255,255,255,0.08); border-left: 4px solid #1abc9c;">
        <h4 style="color: #ffffff; margin-top: 0; margin-bottom: 15px; font-family: 'Segoe UI', sans-serif; font-weight: 700; letter-spacing: 0.5px; text-align: center; font-size: 14px; opacity: 0.9;">PANEL DE CONTROL (ADMINISTRADOR)</h4>
        
        <div class="admin-seccion">
            <h5>1. AGREGAR NUEVA CARPETA</h5>
            <div style="display: flex; gap: 8px; flex-wrap: wrap;">
                <input type="text" id="nueva-carpeta-nombre" class="input-admin-compacto" placeholder="Nombre de Carpeta (Ej: Planificaciones)" style="flex: 1; min-width: 200px;">
                <button onclick="crearCarpetaNueva()" class="btn-admin-compacto"> CREAR CARPETA</button>
            </div>
        </div>

        <div class="admin-seccion">
            <h5>2. SUBIR DOCUMENTO A CARPETA</h5>
            <div style="display: flex; gap: 8px; flex-wrap: wrap;">
                <select id="select-carpeta-destino" class="input-admin-compacto" style="min-width: 180px; cursor: pointer;">
                    <option value=""> Seleccionar Carpeta </option>
                </select>
                <input type="text" id="nombre-doc" class="input-admin-compacto" placeholder="Nombre del documento" style="flex: 1; min-width: 140px;">
                <input type="text" id="desc-doc" class="input-admin-compacto" placeholder="Descripción corta" style="flex: 1; min-width: 140px;">
                <input type="text" id="link-doc" class="input-admin-compacto" placeholder="Link de Drive o OneDrive" style="flex: 1; min-width: 140px;">
                <button onclick="guardarDocumentoEnCarpeta()" class="btn-admin-compacto">GUARDAR DOCUMENTO</button>
            </div>
        </div>
    </div>
    
    <div id="footer" style="clear: both; padding: 40px; text-align: center; background: #0e161d; border-top: 4px solid #1abc9c;">
        <p>INCOREA-CABLES</p>
    </div>
</div>

<script>
const CLAVE_ADMIN = "12345";

// CONFIGURACIÓN DE FIREBASE
const firebaseConfig = {
    apiKey: "TU_API_KEY",
    authDomain: "TU_AUTH_DOMAIN",
    databaseURL: "https://TU_BASE_DE_DATOS.firebaseio.com",
    projectId: "TU_PROJECT_ID",
    storageBucket: "TU_STORAGE_BUCKET",
    messagingSenderId: "TU_MESSAGING_SENDER_ID",
    appId: "TU_APP_ID"
};

// Inicializar Firebase
if (!firebase.apps.length) {
    firebase.initializeApp(firebaseConfig);
}
const dbRef = firebase.database().ref("sistemaCarpetas");
let baseDatos = [];

// Escuchar cambios de la base de datos
dbRef.on('value', (snapshot) => {
    baseDatos = snapshot.val() || [];
    actualizarSelectorCarpetas();
});

function guardarEnFirebase() {
    dbRef.set(baseDatos);
}

function crearCarpetaNueva() {
    const nombreCarpeta = document.getElementById('nueva-carpeta-nombre').value.trim();
    if (!nombreCarpeta) {
        return alert("Por favor, ingresa un nombre para la carpeta.");
    }

    const password = prompt("Ingresa la clave de administrador:");
    if (password === CLAVE_ADMIN) {
        const existe = baseDatos.some(c => c && c.nombre.toLowerCase() === nombreCarpeta.toLowerCase());
        if (existe) {
            return alert("Ya existe una carpeta con ese nombre.");
        }

        baseDatos.push({ nombre: nombreCarpeta, archivos: [] });
        guardarEnFirebase();
        document.getElementById('nueva-carpeta-nombre').value = "";
        alert("Carpeta creada con éxito.");
    } else {
        alert("Clave incorrecta.");
    }
}

function guardarDocumentoEnCarpeta() {
    const carpetaSeleccionada = document.getElementById('select-carpeta-destino').value;
    const nombre = document.getElementById('nombre-doc').value.trim();
    const descripcion = document.getElementById('desc-doc').value.trim();
    const link = document.getElementById('link-doc').value.trim();

    if (!carpetaSeleccionada) {
        return alert("Selecciona la carpeta de destino.");
    }
    if (!nombre || !descripcion || !link) {
        return alert("Completa todos los campos.");
    }

    const password = prompt("Ingresa la clave de administrador:");
    if (password === CLAVE_ADMIN) {
        const carpeta = baseDatos.find(c => c && c.nombre === carpetaSeleccionada);
        if (carpeta) {
            if (!carpeta.archivos) carpeta.archivos = [];
            carpeta.archivos.push({ nombre: nombre, descripcion: descripcion, link: link });
            guardarEnFirebase();

            document.getElementById('nombre-doc').value = "";
            document.getElementById('desc-doc').value = "";
            document.getElementById('link-doc').value = "";
            alert("Documento guardado exitosamente.");
        }
    } else {
        alert("Clave incorrecta.");
    }
}

function actualizarSelectorCarpetas() {
    const select = document.getElementById('select-carpeta-destino');
    select.innerHTML = '<option value="">-- Seleccionar Carpeta --</option>';
    baseDatos.forEach(carpeta => {
        if (carpeta) {
            select.innerHTML += `<option value="${carpeta.nombre}">${carpeta.nombre}</option>`;
        }
    });
}
</script>
</body>
</html>
