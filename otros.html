<!DOCTYPE HTML PUBLIC "-//W3C//DTD HTML 4.01 Transitional//EN" "http://www.w3.org/TR/html4/loose.dtd">
<html>
<head>
<meta http-equiv="Content-Type" content="text/html; charset=utf-8">
<title>COMENTARIOS - INCOREA CABLES</title>
<style>
    body { font-family: sans-serif; background: #0e161d; color: white; margin: 0; scroll-behavior: smooth; }
    #wrapper { padding-bottom: 50px; }
    .container { margin: 20px 5%; }
    .rama { margin-bottom: 30px; border-left: 3px solid #1abc9c; padding-left: 15px; }
    .rama-t { color: #1abc9c; font-size: 20px; font-weight: bold; margin-bottom: 15px; text-transform: uppercase; }
    
    /* Contenedor de archivos abiertos */
    .archivo-visor { margin-bottom: 20px; background: #16212b; padding: 10px; border-radius: 8px; }
    .archivo-titulo { font-size: 14px; color: #aaa; margin-bottom: 8px; display: block; }
    .media-box { width: 100%; max-width: 900px; border: 1px solid #333; border-radius: 4px; overflow: hidden; }
    .media-box img { width: 100%; height: auto; display: block; }
    .media-box iframe { width: 100%; height: 500px; border: none; background: white; }

    /* Admin al final */
    .admin-footer { background: #0a0f14; padding: 30px 5%; border-top: 1px solid #1a252f; margin-top: 50px; }
    .inputs { display: flex; gap: 8px; flex-wrap: wrap; margin-bottom: 12px; }
    input, select { background: #16212b; border: 1px solid #333; color: white; padding: 8px; border-radius: 4px; font-size: 12px; outline: none; }
    button { background: transparent; border: 1px solid #1abc9c; color: #1abc9c; padding: 8px 15px; cursor: pointer; border-radius: 4px; font-size: 11px; transition: 0.3s; }
    button:hover { background: #1abc9c; color: #0e161d; }
    
    #gestion { display: none; margin-top: 20px; background: rgba(0,0,0,0.2); padding: 15px; border-radius: 5px; }
    .edit-item { display: flex; justify-content: space-between; padding: 8px; border-bottom: 1px solid #1a252f; font-size: 12px; align-items: center; }
    .clic-edit { cursor: pointer; color: #888; }
    .clic-edit:hover { color: #1abc9c; }
    .btn-x { border: 1px solid #e74c3c; color: #e74c3c; padding: 3px 8px; background: none; cursor: pointer; }
    .btn-x:hover { background: #e74c3c; color: white; }
</style>
</head>

<body>
<div id="wrapper">
    <div id="header" style="padding: 20px 5%;">
        <h1>INCOREA CABLES</h1>
        <p>Visor de Documentos y Comentarios</p>
    </div>

    <div class="container" id="visor-principal"></div>

    <div class="admin-footer">
        <h4 style="color:#555; margin-bottom:15px;">Panel de Edición</h4>
        <div class="inputs">
            <input type="hidden" id="editIdR"> 
            <input type="text" id="rn" placeholder="Nombre Carpeta">
            <button onclick="saveR()">GUARDAR CARPETA</button>
            <button onclick="verG()" style="border-color:#444; color:#666">GESTIONAR / EDITAR</button>
        </div>
        <div class="inputs">
            <input type="hidden" id="editIdF"> 
            <select id="rd"></select>
            <input type="text" id="fn" placeholder="Nombre Archivo">
            <input type="text" id="fl" placeholder="Link (Imagen o PDF)">
            <button onclick="saveF()">GUARDAR ITEM</button>
        </div>
        <div id="gestion">
            <div id="listaG"></div>
        </div>
    </div>
</div>

<script>
const URL = "https://httpsincorea-cables-default-rtdb.firebaseio.com/db_comentarios";
const KEY = "1234";

window.onload = load;

async function load() {
    const res = await fetch(`${URL}.json`);
    const data = await res.json();
    const v = document.getElementById('visor-principal'), s = document.getElementById('rd'), g = document.getElementById('listaG');
    v.innerHTML = ""; g.innerHTML = ""; s.innerHTML = '<option value="">Seleccionar Carpeta...</option>';
    
    if(!data) return;

    Object.keys(data).forEach(idR => {
        const r = data[idR];
        s.innerHTML += `<option value="${idR}">${r.nombre}</option>`;
        
        let contentHtml = "";
        if(r.archivos) {
            Object.keys(r.archivos).forEach(idF => {
                const f = r.archivos[idF];
                const link = f.link;
                
                // Lógica para detectar si es imagen o necesita iframe
                let mediaTag = "";
                if (link.match(/\.(jpeg|jpg|gif|png|webp)$/i)) {
                    mediaTag = `<img src="${link}" alt="${f.nombre}">`;
                } else {
                    // Para PDFs de Drive/OneDrive o links web
                    let embedUrl = link;
                    if(link.includes("onedrive.live.com")) embedUrl = link.replace("redir", "embed");
                    if(link.includes("drive.google.com")) embedUrl = link.replace("/view", "/preview");
                    mediaTag = `<iframe src="${embedUrl}" allow="autoplay"></iframe>`;
                }

                contentHtml += `
                <div class="archivo-visor">
                    <span class="archivo-titulo">📄 ${f.nombre}</span>
                    <div class="media-box">${mediaTag}</div>
                </div>`;

                // Item para la lista de gestión
                g.innerHTML += `<div class="edit-item">
                    <span class="clic-edit" onclick="upF('${idR}','${idF}','${f.nombre}','${f.link}')">✎ ${f.nombre}</span>
                    <button class="btn-x" onclick="delF('${idR}','${idF}')">Eliminar</button>
                </div>`;
            });
        }

        v.innerHTML += `<div class="rama"><div class="rama-t">${r.nombre}</div>${contentHtml}</div>`;
        g.innerHTML += `<div class="edit-item" style="background:#1a252f"><b class="clic-edit" onclick="upR('${idR}','${r.nombre}')">📁 CARPETA: ${r.nombre}</b><button class="btn-x" onclick="delR('${idR}')">Borrar Rama</button></div>`;
    });
}

// Funciones de Clave y Gestión
function val() { return prompt("Ingrese Clave:") === KEY; }
function verG() { if(val()) document.getElementById('gestion').style.display = "block"; }

function upR(id, n) { document.getElementById('editIdR').value = id; document.getElementById('rn').value = n; }
function upF(idR, idF, n, l) { 
    document.getElementById('rd').value = idR; 
    document.getElementById('editIdF').value = idF; 
    document.getElementById('fn').value = n; 
    document.getElementById('fl').value = l; 
}

async function saveR() {
    const id = document.getElementById('editIdR').value, n = document.getElementById('rn').value;
    if(!n || !val()) return;
    await fetch(id ? `${URL}/${id}.json` : `${URL}.json`, { method: id ? 'PATCH' : 'POST', body: JSON.stringify({nombre: n}) });
    reset(); load();
}

async function saveF() {
    const idR = document.getElementById('rd').value, idF = document.getElementById('editIdF').value, n = document.getElementById('fn').value, l = document.getElementById('fl').value;
    if(!idR || !n || !l || !val()) return;
    await fetch(idF ? `${URL}/${idR}/archivos/${idF}.json` : `${URL}/${idR}/archivos.json`, { method: idF ? 'PATCH' : 'POST', body: JSON.stringify({nombre: n, link: l}) });
    reset(); load();
}

function reset() { document.querySelectorAll('input').forEach(i => i.value = ""); }
async function delR(id) { if(confirm("¿Borrar carpeta?") && val()) { await fetch(`${URL}/${id}.json`, { method:'DELETE' }); load(); } }
async function delF(idR, idF) { if(confirm("¿Borrar archivo?") && val()) { await fetch(`${URL}/${idR}/archivos/${idF}.json`, { method:'DELETE' }); load(); } }
</script>
</body>
</html>
