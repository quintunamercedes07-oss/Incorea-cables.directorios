<!DOCTYPE HTML PUBLIC "-//W3C//DTD HTML 4.01 Transitional//EN" "http://www.w3.org/TR/html4/loose.dtd">
<html>
<head>
<meta http-equiv="Content-Type" content="text/html; charset=utf-8">
<title>VISOR DIRECTO - INCOREA CABLES</title>
<style>
    body { font-family: sans-serif; background: #0e161d; color: white; margin: 0; padding-bottom: 100px; }
    #header { padding: 30px 5%; border-bottom: 1px solid #1abc9c33; text-align: center; }
    
    /* Contenedor de Documentos */
    .container { margin: 20px auto; max-width: 900px; padding: 0 20px; }
    
    .item-documento { margin-bottom: 50px; border-bottom: 1px solid #222; padding-bottom: 30px; }
    .titulo-doc { font-size: 18px; color: #1abc9c; font-weight: bold; margin-bottom: 15px; display: block; }
    
    /* Visor de contenido */
    .visor-marco { width: 100%; background: #16212b; border-radius: 8px; overflow: hidden; border: 1px solid #333; }
    .visor-marco img { width: 100%; height: auto; display: block; }
    .visor-marco iframe { width: 100%; height: 800px; border: none; background: white; }

    /* Panel de administración al final */
    .admin-zona { background: #070b0f; padding: 40px 5%; margin-top: 50px; border-top: 2px solid #1abc9c; }
    .inputs { display: flex; gap: 10px; flex-wrap: wrap; margin-bottom: 15px; align-items: center; }
    input { background: #16212b; border: 1px solid #333; color: white; padding: 10px; border-radius: 4px; flex: 1; min-width: 200px; }
    button { background: #1abc9c; border: none; color: #0e161d; padding: 10px 20px; cursor: pointer; border-radius: 4px; font-weight: bold; transition: 0.3s; }
    button:hover { background: #148f77; }
    
    #gestion { display: none; margin-top: 30px; border-top: 1px dashed #333; padding-top: 20px; }
    .edit-row { display: flex; justify-content: space-between; padding: 10px; background: rgba(255,255,255,0.03); margin-bottom: 5px; border-radius: 4px; font-size: 13px; }
    .btn-del { background: #e74c3c; color: white; padding: 4px 8px; font-size: 11px; }
</style>
</head>

<body>

<div id="header">
    <img src="logo de la empresa.png" style="height:60px; margin-bottom:10px;">
    <h1>INCOREA CABLES</h1>
    <p style="color:#888;">Documentación en Tiempo Real</p>
</div>

<div class="container" id="lista-documentos">
    </div>

<div class="admin-zona">
    <h3 style="color:#1abc9c;">Administrar Contenido</h3>
    <div class="inputs">
        <input type="hidden" id="editId">
        <input type="text" id="fn" placeholder="Nombre del documento o imagen">
        <input type="text" id="fl" placeholder="Link (URL de Imagen o PDF)">
        <button onclick="save()">PUBLICAR / ACTUALIZAR</button>
        <button onclick="verG()" style="background:#333; color:#aaa;">EDITAR LISTA</button>
    </div>

    <div id="gestion">
        <div id="listaG"></div>
    </div>
</div>

<script>
// Usamos una ruta directa sin subcarpetas para simplificar
const URL = "https://httpsincorea-cables-default-rtdb.firebaseio.com/db_documentos_unica";
const KEY = "1234";

window.onload = load;

async function load() {
    const res = await fetch(`${URL}.json`);
    const data = await res.json();
    const v = document.getElementById('lista-documentos');
    const g = document.getElementById('listaG');
    
    v.innerHTML = ""; 
    g.innerHTML = "";
    
    if(!data) {
        v.innerHTML = "<p style='text-align:center; color:#555;'>No hay documentos publicados.</p>";
        return;
    }

    Object.keys(data).forEach(id => {
        const doc = data[id];
        const link = doc.link;

        // Determinar si es imagen o documento para el visor
        let visorHtml = "";
        if (link.match(/\.(jpeg|jpg|gif|png|webp|bmp)$/i)) {
            visorHtml = `<img src="${link}" loading="lazy">`;
        } else {
            let embed = link;
            if(link.includes("onedrive.live.com")) embed = link.replace("redir", "embed");
            if(link.includes("drive.google.com")) embed = link.replace("/view", "/preview");
            visorHtml = `<iframe src="${embed}"></iframe>`;
        }

        // Agregar al visor principal (Para abajo)
        v.innerHTML += `
            <div class="item-documento">
                <span class="titulo-doc">📄 ${doc.nombre}</span>
                <div class="visor-marco">${visorHtml}</div>
            </div>
        `;

        // Agregar a la lista de gestión
        g.innerHTML += `
            <div class="edit-row">
                <span style="cursor:pointer; color:#1abc9c" onclick="preEdit('${id}','${doc.nombre}','${doc.link}')">✎ ${doc.nombre}</span>
                <button class="btn-del" onclick="del('${id}')">Eliminar</button>
            </div>
        `;
    });
}

function val() { return prompt("Clave de acceso:") === KEY; }

function verG() { 
    if(val()) document.getElementById('gestion').style.display = "block"; 
}

function preEdit(id, n, l) {
    document.getElementById('editId').value = id;
    document.getElementById('fn').value = n;
    document.getElementById('fl').value = l;
    window.scrollTo(0, document.body.scrollHeight);
}

async function save() {
    const id = document.getElementById('editId').value;
    const n = document.getElementById('fn').value;
    const l = document.getElementById('fl').value;

    if(!n || !l) { alert("Llena todos los campos"); return; }
    if(!val()) return;

    const metodo = id ? 'PATCH' : 'POST';
    const finalURL = id ? `${URL}/${id}.json` : `${URL}.json`;

    await fetch(finalURL, {
        method: metodo,
        body: JSON.stringify({ nombre: n, link: l })
    });

    reset();
    load();
}

function reset() {
    document.getElementById('editId').value = "";
    document.getElementById('fn').value = "";
    document.getElementById('fl').value = "";
}

async function del(id) {
    if(confirm("¿Seguro que quieres eliminar este documento?") && val()) {
        await fetch(`${URL}/${id}.json`, { method: 'DELETE' });
        load();
    }
}
</script>

</body>
</html>
