<!DOCTYPE HTML PUBLIC "-//W3C//DTD HTML 4.01 Transitional//EN" "http://www.w3.org/TR/html4/loose.dtd">
<html>
<head>
<meta http-equiv="Content-Type" content="text/html; charset=utf-8">
<title>INCOREA - VISOR SÓLIDO</title>
<link href="estilos.css" rel="stylesheet" type="text/css">
<style>
    /* ELIMINAMOS TODO EL AIRE Y MARCOS */
    body, html {
        margin: 0; 
        padding: 0;
        background-color: #0f171e; /* Color de tu fondo */
        overflow-x: hidden;
    }

    /* VISOR PEGADO A LOS BORDES (SÓLIDO) */
    .visor-pro-solido {
        width: 100vw;
        height: 200vh; /* Altura grande para que baje todo recto */
        border: none;
        display: block;
        background: #000;
    }

    /* BOTÓN ADMIN MUY PEQUEÑO AL FINAL */
    .admin-fix {
        position: fixed;
        bottom: 10px;
        right: 10px;
        opacity: 0.3;
        transition: 0.3s;
        z-index: 100;
    }
    .admin-fix:hover { opacity: 1; }
    
    .input-link {
        background: #1a252f;
        border: 1px solid #1abc9c;
        color: white;
        padding: 8px;
        border-radius: 5px;
    }
</style>
</head>

<body>
<div id="wrapper">
    <div id="header">
        <div id="logo-container"><img src="logo de la empresa.png" id="logo-imagen"></div>
        <div id="titulo-container">
            <h1>CALIDAD QUE CONECTA TUS PROYECTOS</h1>
            <p>Estamos para ayudarte</p>
        </div>
    </div>

     <div id="nav">
        <a href="index.html">INICIO</a>
        <a href="directorio.html">DIRECTORIO</a>
           <a href="sistemadegestion.html">SISTEMA DE GESTIÓN</a>
        <a href="global.html">GLOBAL</a>
        <a href="otros.html">OTROS</a>
        <a href="contactos.html">CONTACTOS</a>
    </div>
    <iframe id="doc-solido" class="visor-pro-solido" src="" scrolling="no"></iframe>

    <div class="admin-fix">
        <input type="text" id="l-in" class="input-link" placeholder="Link aquí">
        <button onclick="save()" class="btn-brillante" style="padding: 5px 10px;">OK</button>
    </div>
</div>

<script>
    const DB = "https://httpsincorea-cables-default-rtdb.firebaseio.com/solido.json";
    const KEY = "1234";

    window.onload = async () => {
        const res = await fetch(DB);
        const data = await res.json();
        if(data && data.link) {
            let url = data.link;
            // Limpieza radical de barras de OneDrive/Google
            if(url.includes("onedrive")) {
                url = url.replace("redir", "embed").replace("view.aspx", "embedread.aspx") + "&wdAr=1.77&wdSmallView=1&wdHideHeaders=1&wdHideGridlines=1";
            } else if(url.includes("drive.google.com")) {
                url = url.replace("/view", "/preview");
            }
            document.getElementById('doc-solido').src = url;
        }
    };

    async function save() {
        const l = document.getElementById('l-in').value;
        if(!l) return;
        if(prompt("Clave:") === KEY) {
            await fetch(DB, { method: 'PUT', body: JSON.stringify({ link: l }) });
            location.reload();
        }
    }
</script>
</body>
</html>
