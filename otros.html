<!DOCTYPE HTML PUBLIC "-//W3C//DTD HTML 4.01 Transitional//EN" "http://www.w3.org/TR/html4/loose.dtd">
<html>
<head>
<meta http-equiv="Content-Type" content="text/html; charset=utf-8">
<title>INCOREA CABLES - VISOR</title>
<style>
    /* Diseño según tu imagen */
    body { font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; background: #0e161d; color: white; margin: 0; padding: 0; }
    
    #header { 
        background: linear-gradient(to right, #0e161d, #16212b); 
        padding: 30px 5%; 
        display: flex; 
        justify-content: space-between; 
        align-items: center;
        border-bottom: 2px solid #1abc9c;
    }
    .logo-box img { height: 80px; }
    .slogan-box { text-align: right; }
    .slogan-box h2 { margin: 0; font-size: 24px; letter-spacing: 1px; text-transform: uppercase; }
    .slogan-box p { margin: 0; color: #1abc9c; font-size: 14px; }

    #nav { 
        background: #16212b; 
        padding: 12px 5%; 
        text-align: right; 
        border-bottom: 1px solid #333;
    }
    #nav a { color: #eee; text-decoration: none; font-size: 12px; font-weight: bold; margin-left: 20px; transition: 0.3s; }
    #nav a:hover { color: #1abc9c; }

    /* Contenedor que NO abarca todo el ancho (más elegante) */
    .main-content { 
        width: 85%; 
        max-width: 1000px; 
        margin: 30px auto; 
    }

    .doc-card { 
        background: #16212b; 
        border-radius: 8px; 
        margin-bottom: 40px; 
        overflow: hidden; 
        box-shadow: 0 4px 15px rgba(0,0,0,0.3);
    }
    
    .doc-header { 
        padding: 12px 20px; 
        background: rgba(26, 188, 156, 0.1);
        border-bottom: 1px solid #1abc9c33;
        font-size: 14px;
        color: #1abc9c;
        font-weight: bold;
    }

    /* Visor sólido para PDF e Imágenes */
    .viewer { width: 100%; line-height: 0; }
    .viewer img { width: 100%; height: auto; display: block; }
    
    /* Forma sólida de ver PDF: usamos <object> en lugar de iframe para que sea más nativo */
    .viewer object, .viewer iframe { 
        width: 100%; 
        height: 800px; 
        border: none; 
    }

    /* Panel Admin más pequeño y discreto al final */
    .admin-mini { 
        background: #0a0f14; 
        padding: 20px; 
        border-top: 1px solid #1abc9c; 
        font-size: 11px;
    }
    .inputs-mini { display: flex; gap: 8px; max-width: 800px; margin: 0 auto; }
    .inputs-mini input { 
        background: #0e161d; border: 1px solid #333; color: #888; 
        padding: 6px; border-radius: 3px; flex: 1; font-size: 11px;
    }
    .inputs-mini button { 
        background: transparent; border: 1px solid #1abc9c; color: #1abc9c; 
        padding: 5px 15px; cursor: pointer; border-radius: 3px; font-size: 10px;
    }
    .inputs-mini button:hover { background: #1abc9c; color: #0e161d; }

    #listaG { max-width: 800px; margin: 10px auto; display: none; }
    .item-g { display: flex; justify-content: space-between; padding: 5px 0; border-bottom: 1px solid #222; color: #666; }
</style>
</head>

<body>

<div id="header">
    <div class="logo-box">
        <img src="logo de la empresa.png" alt="Incorea Cables">
    </div>
    <div class="slogan-box">
        <h2>CALIDAD QUE CONECTA TUS PROYECTOS</h2>
        <p>Estamos para ayudarte</p>
    </div>
</div>

<div id="nav">
    <a href="index.html">INICIO</a>
    <a href="directorio.html">DIRECTORIO</a>
    <a href="sistemadegestion.html">SISTEMA DE GESTIÓN</a>
    <a href="global.html">GLOBAL</a>
    <a href="otros.html">OTROS</a>
    <a href="contactos.html">CONTACTOS</a>
</div>

<div class="main-content" id="contenedor-docs">
    </div>

<div class="admin-mini">
    <div class="inputs-mini">
        <input type="hidden" id="editId">
        <input type="text" id="fn" placeholder="Nombre">
        <input type="text" id="fl" placeholder="Link (PDF o Imagen)">
        <button onclick="save()">GUARDAR</button>
        <button onclick="verG()" style="border-color:#444; color:#555">EDITAR</button>
    </div>
    <div id="listaG"></div>
</div>

<script>
const URL = "https://httpsincorea-cables-default-rtdb.firebaseio.com/db_documentos_solidos";
const KEY = "1234";

window.onload = load;

async function load() {
    const res = await fetch(`${URL}.json`);
    const data = await res.json();
    const v = document.getElementById('contenedor-docs');
    const g = document.getElementById('listaG');
    v.innerHTML = ""; g.innerHTML = "";
    
    if(!data) return;

    Object.keys(data).forEach(id => {
        const d = data[id];
        let media = "";
        
        // Convertir links para que se vean directo
        let linkMod = d.link;
        if(d.link.includes("onedrive")) linkMod = d.link.replace("redir", "embed");
        if(d.link.includes("drive.google.com")) linkMod = d.link.replace("/view", "/preview");

        if (d.link.match(/\.(jpeg|jpg|gif|png|webp)$/i)) {
            media = `<img src="${linkMod}">`;
        } else {
            // El tag <object> es más sólido para PDFs que el iframe simple
            media = `<object data="${linkMod}" type="application/pdf">
                        <iframe src="${linkMod}"></iframe>
                     </object>`;
        }

        v.innerHTML += `
            <div class="doc-card">
                <div class="doc-header">${d.nombre.toUpperCase()}</div>
                <div class="viewer">${media}</div>
            </div>`;

        g.innerHTML += `
            <div class="item-g">
                <span onclick="preEdit('${id}','${d.nombre}','${d.link}')" style="cursor:pointer">✎ ${d.nombre}</span>
                <button onclick="del('${id}')" style="color:red; background:none; border:none; cursor:pointer">x</button>
            </div>`;
    });
}

function val() { return prompt("Clave:") === KEY; }
function verG() { if(val()) document.getElementById('listaG').style.display = "block"; }

function preEdit(id, n, l) {
    document.getElementById('editId').value = id;
    document.getElementById('fn').value = n;
    document.getElementById('fl').value = l;
}

async function save() {
    const id = document.getElementById('editId').value;
    const n = document.getElementById('fn').value, l = document.getElementById('fl').value;
    if(!n || !l || !val()) return;
    const path = id ? `${URL}/${id}.json` : `${URL}.json`;
    await fetch(path, { method: id ? 'PATCH' : 'POST', body: JSON.stringify({nombre: n, link: l}) });
    document.getElementById('editId').value = ""; document.getElementById('fn').value = ""; document.getElementById('fl').value = "";
    load();
}

async function del(id) {
    if(confirm("Eliminar?") && val()) {
        await fetch(`${URL}/${id}.json`, { method: 'DELETE' });
        load();
    }
}
</script>

</body>
</html>
