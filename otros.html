<!DOCTYPE HTML PUBLIC "-//W3C//DTD HTML 4.01 Transitional//EN" "http://www.w3.org/TR/html4/loose.dtd">
<html>
<head>
<meta http-equiv="Content-Type" content="text/html; charset=utf-8">
<title>VISOR TOTAL - INCOREA CABLES</title>
<style>
    body { font-family: sans-serif; background: #0e161d; color: white; margin: 0; padding: 0; }
    
    /* Estructura de Cabecera Original */
    #header { padding: 20px 5%; display: flex; align-items: center; background: #0a0f14; border-bottom: 1px solid #1abc9c; }
    #logo-container img { height: 60px; margin-right: 20px; }
    #titulo-container h1 { margin: 0; font-size: 24px; color: #1abc9c; }

    #nav { background: #16212b; padding: 10px 5%; display: flex; gap: 15px; }
    #nav a { color: #eee; text-decoration: none; font-size: 13px; font-weight: bold; }
    #nav a:hover { color: #1abc9c; }

    /* CONTENEDOR TOTAL: Abarca el 100% para que no existan cuadros pequeños */
    .container-full { width: 100%; margin: 0; padding: 0; }

    .item-documento { width: 100%; margin-bottom: 0; border-bottom: 2px solid #1abc9c; }
    
    /* Título discreto sobre el documento */
    .titulo-doc { 
        background: rgba(26, 188, 156, 0.1); 
        padding: 15px 5%; 
        display: block; 
        font-size: 18px; 
        color: #1abc9c; 
        font-weight: bold;
    }

    /* VISOR: Sin límites de altura para que se vea todo hacia abajo */
    .visor-contenido { width: 100%; line-height: 0; }
    .visor-contenido img { 
        width: 100%; 
        height: auto; /* La imagen dicta el largo hacia abajo */
        display: block; 
    }
    .visor-contenido iframe { 
        width: 100%; 
        height: 1500px; /* Altura muy grande para documentos PDF */
        border: none; 
        background: white;
    }

    /* PANEL ADMIN AL FINAL */
    .admin-zona { background: #070b0f; padding: 40px 5%; border-top: 1px solid #1abc9c; margin-top: 50px; }
    .inputs { display: flex; gap: 10px; flex-wrap: wrap; margin-bottom: 20px; }
    input { background: #16212b; border: 1px solid #333; color: white; padding: 12px; border-radius: 4px; flex: 1; }
    button { background: #1abc9c; border: none; color: #0e161d; padding: 12px 25px; cursor: pointer; border-radius: 4px; font-weight: bold; }
    
    #gestion { display: none; margin-top: 20px; max-width: 600px; }
    .fila-edit { display: flex; justify-content: space-between; padding: 10px; border-bottom: 1px solid #1a252f; font-size: 14px; }
    .btn-del { background: #e74c3c; color: white; border: none; padding: 5px 10px; cursor: pointer; }
</style>
</head>

<body>

<div id="header">
    <div id="logo-container"><img src="logo de la empresa.png" id="logo-imagen"></div>
    <div id="titulo-container"><h1>INCOREA CABLES</h1></div>
</div>

<div id="nav">
    <a href="index.html">INICIO</a>
    <a href="directorio.html">DIRECTORIO</a>
    <a href="sistemadegestion.html">SISTEMA DE GESTIÓN</a>
    <a href="global.html">GLOBAL</a>
    <a href="contactos.html">CONTACTOS</a>
</div>

<div class="container-full" id="visor-principal"></div>

<div class="admin-zona">
    <div class="inputs">
        <input type="hidden" id="editId">
        <input type="text" id="fn" placeholder="Nombre del Archivo">
        <input type="text" id="fl" placeholder="Link Directo (Imagen o PDF)">
        <button onclick="save()">PUBLICAR DOCUMENTO</button>
        <button onclick="verG()" style="background:#333; color:#eee;">EDITAR LISTA</button>
    </div>
    <div id="gestion">
        <div id="listaG"></div>
    </div>
</div>

<script>
const URL = "https://httpsincorea-cables-default-rtdb.firebaseio.com/db_visor_directo";
const KEY = "1234";

window.onload = load;

async function load() {
    const res = await fetch(`${URL}.json`);
    const data = await res.json();
    const v = document.getElementById('visor-principal');
    const g = document.getElementById('listaG');
    v.innerHTML = ""; g.innerHTML = "";
    
    if(!data) return;

    Object.keys(data).forEach(id => {
        const d = data[id];
        let media = "";
        
        // Detección de imagen para flujo vertical total
        if (d.link.match(/\.(jpeg|jpg|gif|png|webp)$/i)) {
            media = `<img src="${d.link}">`;
        } else {
            // Iframe para documentos
            let linkMod = d.link;
            if(d.link.includes("onedrive")) linkMod = d.link.replace("redir", "embed");
            if(d.link.includes("drive.google.com")) linkMod = d.link.replace("/view", "/preview");
            media = `<iframe src="${linkMod}"></iframe>`;
        }

        v.innerHTML += `
            <div class="item-documento">
                <span class="titulo-doc">FILE: ${d.nombre}</span>
                <div class="visor-contenido">${media}</div>
            </div>`;

        g.innerHTML += `
            <div class="fila-edit">
                <span onclick="preEdit('${id}','${d.nombre}','${d.link}')" style="cursor:pointer; color:#1abc9c">✎ ${d.nombre}</span>
                <button class="btn-del" onclick="del('${id}')">Borrar</button>
            </div>`;
    });
}

function val() { return prompt("Clave:") === KEY; }
function verG() { if(val()) document.getElementById('gestion').style.display = "block"; }

function preEdit(id, n, l) {
    document.getElementById('editId').value = id;
    document.getElementById('fn').value = n;
    document.getElementById('fl').value = l;
    window.scrollTo(0, document.body.scrollHeight);
}

async function save() {
    const id = document.getElementById('editId').value;
    const n = document.getElementById('fn').value, l = document.getElementById('fl').value;
    if(!n || !l || !val()) return;
    const path = id ? `${URL}/${id}.json` : `${URL}.json`;
    await fetch(path, { method: id ? 'PATCH' : 'POST', body: JSON.stringify({nombre: n, link: l}) });
    document.getElementById('editId').value = "";
    document.getElementById('fn').value = "";
    document.getElementById('fl').value = "";
    load();
}

async function del(id) {
    if(confirm("¿Eliminar archivo?") && val()) {
        await fetch(`${URL}/${id}.json`, { method: 'DELETE' });
        load();
    }
}
</script>

</body>
</html>
