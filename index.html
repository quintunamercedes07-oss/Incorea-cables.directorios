<!DOCTYPE HTML PUBLIC "-//W3C//DTD HTML 4.01 Transitional//EN" "http://www.w3.org/TR/html4/loose.dtd">
<html>
<head>
<meta http-equiv="Content-Type" content="text/html; charset=utf-8">
<title>DAILY MENÚ</title>
<link href="estilos.css" rel="stylesheet" type="test/css">
<style>
    /* Fondo general negro puro */
    body { font-family: 'Helvetica Neue', Arial, sans-serif; background: #000000; color: white; margin: 0; overflow-x: hidden; }

    #wrapper {
        background: #000000;
    }

    #header {
        background: #000000 !important;
        padding: 25px 5%;
        display: flex;
        align-items: center;
        border-bottom: 1px solid #1a252f;
    }

    /* LOGO MÁS GRANDE */
    #logo-imagen {
        max-height: 110px; /* Aumentado de 70px a 110px */
        width: auto;
    }

    #titulo-container {
        margin-left: 25px;
    }

    #titulo-container h1 {
        color: #ffffff;
        margin: 0;
        font-size: 30px;
        letter-spacing: 2px;
    }

    #titulo-container p {
        color: #1abc9c;
        margin: 5px 0 0 0;
        font-size: 14px;
        letter-spacing: 1px;
    }

    #nav {
        background: #000000 !important;
        padding: 15px 5%;
        display: flex;
        gap: 30px;
        border-bottom: 2px solid #1abc9c;
    }

    #nav a {
        color: #ffffff;
        text-decoration: none;
        font-weight: bold;
        font-size: 14px;
        letter-spacing: 1px;
        transition: color 0.3s;
    }

    #nav a:hover {
        color: #1abc9c;
    }

    /* --- HERO DINÁMICO CON FORMA --- */
    .hero-dinamico {
        position: relative;
        height: 600px;
        width: 100%;
        background: #000000;
        overflow: hidden;
        clip-path: polygon(0 0, 100% 0, 100% 85%, 0% 100%);
    }

    .hero-bg {
        position: absolute;
        top: 0; left: 0;
        width: 100%; height: 100%;
        background-image: linear-gradient(rgba(0, 0, 0, 0.7), rgba(0, 0, 0, 0.9)), url('fondo verde.jpg');
        background-size: cover;
        background-position: center;
        animation: zoomHero 20s infinite alternate;
        z-index: 1;
    }

    @keyframes zoomHero {
        from { transform: scale(1); }
        to { transform: scale(1.2); }
    }

    .hero-overlay {
        position: relative;
        z-index: 2;
        display: flex;
        flex-direction: column;
        justify-content: center;
        align-items: center;
        height: 100%;
        text-align: center;
        padding: 0 20px;
    }

    .hero-overlay h2 { 
        font-size: 60px; 
        letter-spacing: 10px; 
        margin: 0; 
        text-shadow: 2px 2px 20px rgba(0,0,0,0.9);
        animation: fadeInUp 1s ease-out;
    }

    .hero-overlay p { 
        font-size: 18px; 
        color: #1abc9c; 
        font-weight: bold; 
        margin-top: 15px;
        letter-spacing: 3px;
    }

    .btn-brillante {
        margin-top: 30px;
        padding: 15px 40px;
        background: #1abc9c;
        color: #000000;
        text-decoration: none;
        font-weight: bold;
        border-radius: 50px;
        transition: 0.3s;
        box-shadow: 0 0 20px rgba(26, 188, 156, 0.4);
    }

    .btn-brillante:hover {
        background: white;
        box-shadow: 0 0 30px rgba(255, 255, 255, 0.6);
        transform: scale(1.05);
    }

    @keyframes fadeInUp {
        from { opacity: 0; transform: translateY(30px); }
        to { opacity: 1; transform: translateY(0); }
    }

    .img-hero-pequena {
        width: 150px;
        border-radius: 10px;
        margin-top: 20px;
        border: 2px solid #1abc9c;
    }

    #footer {
        background: #000000;
        color: #888;
        text-align: center;
        padding: 40px;
        border-top: 1px solid #1a252f;
    }
</style>
</head>
<body>
<div id="wrapper">
    <div id="header">
        <div id="logo-container"><img src="1792723651205.png" id="logo-imagen" alt="Logo"></div>
        <div id="titulo-container">
            <h1>DAILY MENÚ</h1>
            <p>Más salud en tu plato, más energía en tu vida</p>
        </div>
    </div>

    <div id="nav">
        <a href="index.html">INICIO</a>
        <a href="directorio.html">NOSOTROS</a>
        <a href="sistemadegestion.html">NUESTROS PLATOS</a>
        <a href="contactos.html">CONTACTOS</a>
    </div>

    <div class="hero-dinamico">
        <div class="hero-bg"></div> 
        <div class="hero-overlay">
            <h2>CAMBIA TU VIDA</h2>
            <p>SALUD Y BIENESTAR</p>
            <img src="grupo.jfif" class="img-hero-pequena" alt="grupo">
            <br>
            <a href="contactos.html" class="btn-brillante">DESCUBRIR MÁS</a>
        </div>
    </div>

    <div id="main-container" style="padding: 80px 5%; text-align: center;">
        <h2 style="color:#1abc9c; font-size: 32px; letter-spacing: 2px;">TU MEJOR OPCIÓN</h2>
        <p style="color:#888; margin-bottom: 40px;">Cambia ahora tu alimentación.</p>
        
        <div class="servicios-grid"></div>
    </div>

    <div id="footer">
        <p>&copy; DAILY_MENÚ</p>
    </div>
</div>
</body>
</html>
