<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Teóricos de la Administración - Galería de Videos</title>
  <!-- Fuentes elegantes -->
  <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,600;1,400&family=Plus+Jakarta+Sans:wght@400;500;600&display=swap" rel="stylesheet">
  
  <style>
    :root {
      --bg-color: #f5f2eb;
      --card-text: #2c2927;
      
      /* Colores neutros elegantes para 8 tarjetas */
      --c1: #d8c3b0;
      --c2: #b5c0ad;
      --c3: #e2d4c9;
      --c4: #a8b5b2;
      --c5: #c9b09a;
      --c6: #d4caa3;
      --c7: #b3a598;
      --c8: #c2b6a6;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      font-family: 'Plus Jakarta Sans', sans-serif;
      background-color: var(--bg-color);
      background-image: radial-gradient(#d3c9b8 1px, transparent 1px);
      background-size: 24px 24px;
      color: var(--card-text);
      min-height: 100vh;
      padding: 30px 20px;
    }

    header {
      text-align: center;
      margin-bottom: 30px;
      position: relative;
    }

    header h1 {
      font-family: 'Playfair Display', serif;
      font-size: 2.8rem;
      font-weight: 600;
      color: #38312d;
    }

    header p {
      font-size: 0.95rem;
      color: #756a63;
      margin-top: 5px;
    }

    /* BOTÓN MODO CREADORA */
    .admin-toggle-btn {
      position: absolute;
      top: 0;
      right: 10px;
      background: #e6dfd5;
      border: 1px solid #c9beaf;
      padding: 6px 12px;
      border-radius: 20px;
      font-size: 0.75rem;
      color: #594f47;
      cursor: pointer;
      font-weight: 600;
      transition: all 0.2s ease;
    }

    .admin-toggle-btn:hover {
      background: #38312d;
      color: #fff;
    }

    /* COLLAGE DESORGANIZADO */
    .collage-board {
      max-width: 1100px;
      margin: 0 auto;
      display: flex;
      flex-wrap: wrap;
      justify-content: center;
      align-items: center;
      gap: 25px;
      padding: 20px 10px;
    }

    /* TARJETAS CON VISTA PREVIA DE VIDEO */
    .author-card {
      position: relative;
      padding: 16px;
      cursor: pointer;
      box-shadow: 0 8px 20px rgba(70, 60, 50, 0.08);
      transition: all 0.35s cubic-bezier(0.25, 1, 0.5, 1);
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: space-between;
      border: 2px solid rgba(255, 255, 255, 0.6);
      color: #332d29;
    }

    .author-card:hover {
      transform: scale(1.07) rotate(0deg) !important;
      z-index: 10;
      box-shadow: 0 16px 32px rgba(70, 60, 50, 0.15);
    }

    /* CONTENEDOR DE LA VISTA PREVIA */
    .video-thumbnail-box {
      width: 100%;
      height: 110px;
      border-radius: 14px;
      background: rgba(0, 0, 0, 0.06);
      margin: 10px 0;
      overflow: hidden;
      display: flex;
      justify-content: center;
      align-items: center;
      position: relative;
      border: 1px solid rgba(255, 255, 255, 0.4);
    }

    .video-thumbnail-box video {
      width: 100%;
      height: 100%;
      object-fit: cover;
    }

    /* BOTÓN PLAY SUPERPUESTO */
    .play-icon-overlay {
      position: absolute;
      width: 36px;
      height: 36px;
      background: rgba(255, 255, 255, 0.85);
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 0.9rem;
      color: #38312d;
      box-shadow: 0 4px 10px rgba(0,0,0,0.15);
      transition: transform 0.2s;
    }

    .author-card:hover .play-icon-overlay {
      transform: scale(1.15);
      background: #ffffff;
    }

    .author-card h3 {
      font-family: 'Playfair Display', serif;
      font-size: 1.15rem;
      text-align: center;
      line-height: 1.2;
    }

    .author-card .genre-tag {
      background: rgba(255, 255, 255, 0.5);
      color: #4a423d;
      font-size: 0.65rem;
      padding: 4px 8px;
      border-radius: 10px;
      font-weight: 600;
      text-transform: uppercase;
      margin-top: 5px;
      display: inline-block;
    }

    /* TAMAÑOS Y ROTACIONES PARA LOS 8 AUTORES */
    .card-1 { background: var(--c1); width: 220px; transform: rotate(-4deg); border-radius: 28px 15px 25px 20px; }
    .card-2 { background: var(--c2); width: 210px; transform: rotate(3deg);  border-radius: 15px 32px 20px 28px; }
    .card-3 { background: var(--c3); width: 225px; transform: rotate(-2deg); border-radius: 25px 18px 30px 15px; }
    .card-4 { background: var(--c4); width: 215px; transform: rotate(5deg);  border-radius: 18px 25px 15px 30px; }
    .card-5 { background: var(--c5); width: 220px; transform: rotate(-5deg); border-radius: 30px 20px 18px 25px; }
    .card-6 { background: var(--c6); width: 225px; transform: rotate(4deg);  border-radius: 20px 28px 25px 15px; }
    .card-7 { background: var(--c7); width: 210px; transform: rotate(-3deg); border-radius: 25px 15px 28px 20px; }
    .card-8 { background: var(--c8); width: 230px; transform: rotate(3deg);  border-radius: 18px 30px 15px 25px; }

    /* MODO CREADORA: SUBIDA DE ARCHIVOS */
    .admin-upload-section {
      display: none;
      margin-top: 8px;
      width: 100%;
    }

    body.admin-mode .admin-upload-section {
      display: block;
    }

    .admin-upload-section input[type=file] { display: none; }

    .custom-upload-btn {
      display: block;
      background: #38312d;
      color: #fff;
      text-align: center;
      padding: 5px 10px;
      border-radius: 8px;
      font-size: 0.7rem;
      font-weight: 600;
      cursor: pointer;
    }

    /* REPRODUCTOR DINÁMICO POP-UP */
    .overlay {
      position: fixed;
      top: 0; left: 0;
      width: 100vw; height: 100vh;
      background: rgba(40, 35, 32, 0.55);
      backdrop-filter: blur(6px);
      display: none;
      justify-content: center;
      align-items: center;
      z-index: 1000;
      opacity: 0;
      transition: opacity 0.3s ease;
    }

    .overlay.active {
      display: flex;
      opacity: 1;
    }

    .expanded-card {
      background: #faf8f5;
      width: 90%;
      max-width: 680px;
      border-radius: 24px;
      padding: 25px;
      position: relative;
      transform: scale(0.85);
      transition: transform 0.35s cubic-bezier(0.175, 0.885, 0.32, 1.275);
      box-shadow: 0 20px 40px rgba(0,0,0,0.18);
      border: 1px solid #e8e2d8;
    }

    .overlay.active .expanded-card {
      transform: scale(1);
    }

    .close-btn {
      position: absolute;
      top: 15px; right: 20px;
      font-size: 1.6rem;
      background: none;
      border: none;
      cursor: pointer;
      color: #756a63;
    }

    .expanded-title {
      font-family: 'Playfair Display', serif;
      font-size: 1.8rem;
      color: #38312d;
    }

    .expanded-genre {
      font-size: 0.8rem;
      font-weight: 600;
      color: #8c7f76;
      text-transform: uppercase;
      margin-bottom: 15px;
    }

    .video-player-box {
      width: 100%;
      border-radius: 14px;
      overflow: hidden;
      background: #1f1c1a;
      max-height: 400px;
      display: flex;
      justify-content: center;
      align-items: center;
    }

    .video-player-box video {
      width: 100%;
      max-height: 400px;
    }

    .no-video-msg {
      color: #d8c3b0;
      padding: 35px;
      text-align: center;
      font-size: 0.9rem;
    }
  </style>
</head>
<body>

  <header>
    <button class="admin-toggle-btn" onclick="toggleAdminMode()" id="adminBtn">🔒 Modo Creadora</button>
    <h1>Teóricos de la Administración</h1>
    <p>Haz clic en cualquier tarjeta para reproducir el video del autor.</p>
  </header>

  <!-- COLLAGE DE 8 AUTORES -->
  <main class="collage-board" id="collageBoard"></main>

  <!-- VENTANA DINÁMICA DE REPRODUCCIÓN -->
  <div class="overlay" id="videoOverlay">
    <div class="expanded-card">
      <button class="close-btn" onclick="closeVideo()">✕</button>
      <h2 class="expanded-title" id="expTitle">Autor</h2>
      <p class="expanded-genre" id="expGenre">Pensamiento</p>
      
      <div class="video-player-box" id="videoContainer"></div>
    </div>
  </div>

  <script>
    // DATOS DE LOS 8 AUTORES
    const authors = [
      { id: 1, name: "Frederick Winslow Taylor", genre: "Administración Científica", videoSrc: null },
      { id: 2, name: "Henri Fayol", genre: "Teoría Clásica de la Adm.", videoSrc: null },
      { id: 3, name: "Henry Ford", genre: "Producción en Masa", videoSrc: null },
      { id: 4, name: "Max Weber", genre: "Modelo Burocrático", videoSrc: null },
      { id: 5, name: "Herbert Simon", genre: "Racionalidad Limitada", videoSrc: null },
      { id: 6, name: "George B. Dantzig", genre: "Programación Lineal", videoSrc: null },
      { id: 7, name: "Peter Drucker", genre: "Administración Moderna", videoSrc: null },
      { id: 8, name: "Ludwig von Bertalanffy", genre: "Teoría General de Sistemas", videoSrc: null }
    ];

    const board = document.getElementById('collageBoard');

    // CREAR LAS TARJETAS CON VISTA PREVIA
    function renderBoard() {
      board.innerHTML = '';
      authors.forEach((author, index) => {
        const card = document.createElement('div');
        card.className = `author-card card-${index + 1}`;
        card.onclick = () => playAuthorVideo(index);
        
        const thumbnailHTML = author.videoSrc 
          ? `<video src="${author.videoSrc}#t=0.5" preload="metadata"></video>`
          : `<span style="font-size: 1.8rem; opacity: 0.5;">🎬</span>`;

        card.innerHTML = `
          <div style="text-align: center; width: 100%;">
            <h3>${author.name}</h3>
            <span class="genre-tag">${author.genre}</span>
          </div>
          
          <div class="video-thumbnail-box">
            ${thumbnailHTML}
            <div class="play-icon-overlay">▶</div>
          </div>
          
          <div class="admin-upload-section" onclick="event.stopPropagation();">
            <label class="custom-upload-btn" for="file-${index}">
              📁 Cargar Video
            </label>
            <input id="file-${index}" type="file" accept="video/*" onchange="handleFileUpload(event, ${index})"/>
          </div>
        `;
        
        board.appendChild(card);
      });
    }

    // ACTIVAR / DESACTIVAR MODO CREADORA
    function toggleAdminMode() {
      document.body.classList.toggle('admin-mode');
      const btn = document.getElementById('adminBtn');
      if (document.body.classList.contains('admin-mode')) {
        btn.innerHTML = '🔓 Modo Creadora (Activo)';
        btn.style.background = '#38312d';
        btn.style.color = '#fff';
      } else {
        btn.innerHTML = '🔒 Modo Creadora';
        btn.style.background = '#e6dfd5';
        btn.style.color = '#594f47';
      }
    }

    // CARGAR ARCHIVO DE VIDEO LOCAL
    function handleFileUpload(event, index) {
      const file = event.target.files[0];
      if (file) {
        const fileURL = URL.createObjectURL(file);
        authors[index].videoSrc = fileURL;
        renderBoard();
      }
    }

    // ABRIR Y REPRODUCIR EL VIDEO
    function playAuthorVideo(index) {
      const author = authors[index];
      document.getElementById('expTitle').innerText = author.name;
      document.getElementById('expGenre').innerText = author.genre;

      const container = document.getElementById('videoContainer');
      
      if (author.videoSrc) {
        container.innerHTML = `<video src="${author.videoSrc}" controls autoplay></video>`;
      } else {
        container.innerHTML = `
          <div class="no-video-msg">
            🎥 El video de este autor aún no está subido.<br>
            <small style="opacity: 0.7; margin-top:5px; display:block;">Usa el "Modo Creadora" arriba para subirlo.</small>
          </div>`;
      }

      document.getElementById('videoOverlay').classList.add('active');
    }

    // CERRAR REPRODUCCIÓN
    function closeVideo() {
      document.getElementById('videoOverlay').classList.remove('active');
      document.getElementById('videoContainer').innerHTML = '';
    }

    // Inicializar la galería
    renderBoard();
  </script>
</body>
</html>
