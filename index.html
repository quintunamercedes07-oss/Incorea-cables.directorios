<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Voces Literarias - Collage Interactivo</title>
  <link href="https://fonts.googleapis.com/css2?family=Caveat:wght@700&family=Poppins:wght@400;600;700&display=swap" rel="stylesheet">
  
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      font-family: 'Poppins', sans-serif;
      background-color: #f7f3ed;
      /* Fondo con textura artística suave */
      background-image: radial-gradient(#d3c9b8 1px, transparent 1px);
      background-size: 20px 20px;
      color: #2b2b2b;
      min-height: 100vh;
      overflow-x: hidden;
      padding: 20px;
    }

    header {
      text-align: center;
      margin-bottom: 20px;
    }

    header h1 {
      font-family: 'Caveat', cursive;
      font-size: 3.5rem;
      color: #8c2d19;
      transform: rotate(-2deg);
      text-shadow: 2px 2px 0px #fff;
    }

    header p {
      font-size: 1rem;
      color: #666;
    }

    /* CONTENEDOR TIPO CANVAS / COLLAGE */
    .collage-board {
      position: relative;
      max-width: 1100px;
      min-height: 750px;
      margin: 0 auto;
      display: flex;
      flex-wrap: wrap;
      justify-content: center;
      align-items: center;
      gap: 25px;
      padding: 30px 10px;
    }

    /* TARJETAS CON ESTILO "DESORGANIZADO DIVERTIRO" */
    .author-card {
      position: relative;
      background: #ffffff;
      border-radius: 24px;
      padding: 20px;
      cursor: pointer;
      box-shadow: 0 10px 20px rgba(0,0,0,0.08);
      transition: all 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.275);
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: space-between;
      border: 3px solid rgba(255,255,255,0.8);
      z-index: 1;
    }

    .author-card:hover {
      transform: scale(1.08) rotate(0deg) !important;
      z-index: 10;
      box-shadow: 0 18px 30px rgba(0,0,0,0.18);
    }

    .author-card h3 {
      font-family: 'Caveat', cursive;
      font-size: 1.8rem;
      color: #fff;
      text-align: center;
      line-height: 1.1;
      margin-bottom: 8px;
    }

    .author-card .genre-tag {
      background: rgba(255,255,255,0.25);
      color: #fff;
      font-size: 0.75rem;
      padding: 4px 10px;
      border-radius: 12px;
      font-weight: 600;
      text-transform: uppercase;
    }

    /* BOTÓN PARA SUBIR VIDEO EN LA TARJETA */
    .upload-btn-wrapper {
      margin-top: 12px;
      width: 100%;
    }

    .upload-btn-wrapper input[type=file] {
      display: none;
    }

    .custom-upload-btn {
      display: block;
      background: rgba(255, 255, 255, 0.9);
      color: #333;
      text-align: center;
      padding: 6px 12px;
      border-radius: 10px;
      font-size: 0.8rem;
      font-weight: 700;
      cursor: pointer;
      transition: background 0.2s;
    }

    .custom-upload-btn:hover {
      background: #ffffff;
    }

    /* COLORES Y FORMAS INDIVIDUALES DESORGANIZADAS */
    .card-1  { background: #e74c3c; width: 220px; height: 180px; transform: rotate(-5deg);  border-radius: 35px 15px 30px 20px; }
    .card-2  { background: #27ae60; width: 190px; height: 210px; transform: rotate(4deg);   border-radius: 15px 40px 20px 35px; }
    .card-3  { background: #f39c12; width: 240px; height: 170px; transform: rotate(-3deg);  border-radius: 30px 20px 40px 15px; }
    .card-4  { background: #2980b9; width: 200px; height: 190px; transform: rotate(6deg);   border-radius: 20px 30px 15px 40px; }
    .card-5  { background: #8e44ad; width: 210px; height: 200px; transform: rotate(-6deg);  border-radius: 40px 25px 20px 30px; }
    .card-6  { background: #d35400; width: 230px; height: 175px; transform: rotate(3deg);   border-radius: 25px 35px 30px 15px; }
    .card-7  { background: #16a085; width: 195px; height: 205px; transform: rotate(-4deg);  border-radius: 30px 15px 35px 25px; }
    .card-8  { background: #c0392b; width: 225px; height: 185px; transform: rotate(5deg);   border-radius: 20px 40px 15px 30px; }
    .card-9  { background: #d4ac0d; width: 205px; height: 195px; transform: rotate(-7deg);  border-radius: 35px 20px 30px 25px; }
    .card-10 { background: #2c3e50; width: 235px; height: 180px; transform: rotate(2deg);   border-radius: 15px 30px 25px 40px; }
    .card-11 { background: #9b59b6; width: 215px; height: 190px; transform: rotate(-3deg);  border-radius: 30px 35px 20px 20px; }

    /* VISTA DE EXPANSIÓN DINÁMICA (EN LA MISMA PÁGINA) */
    .overlay {
      position: fixed;
      top: 0;
      left: 0;
      width: 100vw;
      height: 100vh;
      background: rgba(0, 0, 0, 0.6);
      backdrop-filter: blur(5px);
      display: none;
      justify-content: center;
      align-items: center;
      z-index: 1000;
      opacity: 0;
      transition: opacity 0.3s ease;
    }

    .overlay.active {
      display: flex;
      opacity: 1;
    }

    .expanded-card {
      background: #fff;
      width: 90%;
      max-width: 700px;
      border-radius: 28px;
      padding: 30px;
      position: relative;
      transform: scale(0.7);
      transition: transform 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.275);
      box-shadow: 0 25px 50px rgba(0,0,0,0.3);
    }

    .overlay.active .expanded-card {
      transform: scale(1);
    }

    .close-btn {
      position: absolute;
      top: 15px;
      right: 20px;
      font-size: 2rem;
      background: none;
      border: none;
      cursor: pointer;
      color: #666;
    }

    .expanded-title {
      font-family: 'Caveat', cursive;
      font-size: 2.8rem;
      margin-bottom: 5px;
    }

    .expanded-genre {
      font-weight: 600;
      color: #777;
      margin-bottom: 15px;
    }

    .video-player-box {
      width: 100%;
      border-radius: 16px;
      overflow: hidden;
      background: #000;
      max-height: 400px;
      display: flex;
      justify-content: center;
      align-items: center;
    }

    .video-player-box video {
      width: 100%;
      max-height: 400px;
    }

    .no-video-msg {
      color: #fff;
      padding: 40px;
      text-align: center;
    }
  </style>
</head>
<body>

  <header>
    <h1>✨ Voces Literarias ✨</h1>
    <p>Haz clic en cada autor para reproducir su video o sube uno nuevo directamente.</p>
  </header>

  <!-- COLLAGE DE LOS 11 AUTORES -->
  <main class="collage-board" id="collageBoard"></main>

  <!-- VENTANA DINÁMICA DE REPRODUCCIÓN (EN LA MISMA PÁGINA) -->
  <div class="overlay" id="videoOverlay">
    <div class="expanded-card">
      <button class="close-btn" onclick="closeVideo()">✕</button>
      <h2 class="expanded-title" id="expTitle">Autor</h2>
      <p class="expanded-genre" id="expGenre">Género</p>
      
      <div class="video-player-box" id="videoContainer">
        <!-- El video subido se inserta aquí -->
      </div>
    </div>
  </div>

  <script>
    // DATOS DE LOS 11 AUTORES
    const authors = [
      { id: 1, name: "Gabriel García M.", genre: "Realismo Mágico", videoSrc: null },
      { id: 2, name: "Isabel Allende", genre: "Novela Contemporánea", videoSrc: null },
      { id: 3, name: "Jorge Luis Borges", genre: "Ficción & Ensayo", videoSrc: null },
      { id: 4, name: "Julio Cortázar", genre: "Cuento Fantástico", videoSrc: null },
      { id: 5, name: "Mario Vargas Llosa", genre: "Narrativa Moderna", videoSrc: null },
      { id: 6, name: "Laura Esquivel", genre: "Literatura Romántica", videoSrc: null },
      { id: 7, name: "Octavio Paz", genre: "Poesía & Filosofía", videoSrc: null },
      { id: 8, name: "Pablo Neruda", genre: "Poesía Lírica", videoSrc: null },
      { id: 9, name: "Gabriela Mistral", genre: "Poesía Educativa", videoSrc: null },
      { id: 10, name: "Juan Rulfo", genre: "Ficción Mexicana", videoSrc: null },
      { id: 11, name: "Carlos Fuentes", genre: "Ensayo & Novela", videoSrc: null }
    ];

    const board = document.getElementById('collageBoard');

    // MOSTRAR LAS 11 TARJETAS EN EL COLLAGE
    authors.forEach((author, index) => {
      const card = document.createElement('div');
      card.className = `author-card card-${index + 1}`;
      
      card.innerHTML = `
        <div style="width: 100%; text-align: center;" onclick="playAuthorVideo(${index})">
          <h3>${author.name}</h3>
          <span class="genre-tag">${author.genre}</span>
        </div>
        
        <div class="upload-btn-wrapper" onclick="event.stopPropagation();">
          <label class="custom-upload-btn" for="file-upload-${index}">
            📁 Subir Video
          </label>
          <input id="file-upload-${index}" type="file" accept="video/*" onchange="handleFileUpload(event, ${index})"/>
        </div>
      `;
      
      board.appendChild(card);
    });

    // GUARDAR EL VIDEO SUBIDO DESDE EL NAVEGADOR
    function handleFileUpload(event, index) {
      const file = event.target.files[0];
      if (file) {
        const fileURL = URL.createObjectURL(file);
        authors[index].videoSrc = fileURL;
        alert(`¡Video cargado con éxito para ${authors[index].name}! Haz clic en el cuadro para verlo.`);
      }
    }

    // ABRIR REPRODUCCIÓN DINÁMICA
    function playAuthorVideo(index) {
      const author = authors[index];
      document.getElementById('expTitle').innerText = author.name;
      document.getElementById('expGenre').innerText = author.genre;

      const container = document.getElementById('videoContainer');
      
      if (author.videoSrc) {
        container.innerHTML = `<video src="${author.videoSrc}" controls autoplay></video>`;
      } else {
        container.innerHTML = `
          <div class="no-video-msg">
            🎬 Aún no has subido un video para este autor.<br><br>
            ¡Haz clic en el botón <b>"📁 Subir Video"</b> de su tarjeta para agregarlo!
          </div>`;
      }

      const overlay = document.getElementById('videoOverlay');
      overlay.classList.add('active');
    }

    // CERRAR VIDEO
    function closeVideo() {
      const overlay = document.getElementById('videoOverlay');
      overlay.classList.remove('active');
      document.getElementById('videoContainer').innerHTML = ''; // Detiene la reproducción
    }
  </script>
</body>
</html>
