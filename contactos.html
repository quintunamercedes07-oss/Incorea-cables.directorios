<!DOCTYPE HTML PUBLIC "-//W3C//DTD HTML 4.01 Transitional//EN" "http://www.w3.org/TR/html4/loose.dtd">
<html>
<head>
<meta http-equiv="Content-Type" content="text/html; charset=utf-8">
<title>CONTACTOS - INCOREA CABLES</title>
<link href="estilos.css" rel="stylesheet" type="text/css">
<style>
    body { font-family: sans-serif; background: #0e161d; color: white; margin: 0; }
    
    /* ESTILO DEL FORMULARIO PARA EL MEDIO */
    .contacto-wrapper { 
        display: flex; 
        max-width: 1000px; 
        margin: 40px auto; 
        padding: 20px; 
        gap: 50px;
        background: rgba(255,255,255,0.02);
        border-radius: 8px;
    }
    .form-side { flex: 2; }
    .info-side { flex: 1; border-left: 1px solid #1abc9c33; padding-left: 30px; }

    .input-group { margin-bottom: 20px; }
    .input-group label { display: block; font-size: 11px; color: #1abc9c; font-weight: bold; margin-bottom: 8px; text-transform: uppercase; }
    .input-group input, .input-group textarea { 
        width: 100%; border: 1px solid #333; background: #0a0f14; padding: 12px; 
        box-sizing: border-box; outline: none; color: white; border-radius: 4px;
    }
    .input-group input:focus, .input-group textarea:focus { border-color: #1abc9c; }
    
    .btn-submit { 
        background: #1abc9c; color: #0e161d; border: none; padding: 12px 30px; 
        text-transform: uppercase; font-weight: bold; cursor: pointer; border-radius: 4px;
    }
    .btn-submit:hover { background: #16a085; }

    .info-side h3 { color: #1abc9c; font-size: 16px; margin-bottom: 15px; }
    .info-side p { font-size: 14px; color: #aaa; line-height: 1.6; margin-bottom: 20px; }
</style>
</head>

<body>
<div id="wrapper">
    <div id="header">
        <div id="logo-container"><img src="logo de la empresa.png" id="logo-imagen"></div>
        <div id="titulo-container">
            <h1>INCOREA CABLES</h1>
            <p id="sub-txt">CONTACTOS</p>
        </div>
    </div>

    <div id="nav">
        <a href="index.html">INICIO</a>
        <a href="directorio.html">DIRECTORIO</a>
        <a href="servicios.html">SERVICIOS</a>
        <a href="sugerencias.html">SUGERENCIAS</a>
        <a href="comentarios.html">COMENTARIOS</a>
        <a href="contactos.html">CONTACTOS</a>
    </div>

    <div class="contacto-wrapper">
        <div class="form-side">
            <div class="input-group">
                <label>Nombre *</label>
                <input type="text" id="nom">
            </div>
            <div class="input-group">
                <label>Email *</label>
                <input type="email" id="eml">
            </div>
            <div class="input-group">
                <label>Empresa</label>
                <input type="text" id="emp">
            </div>
            <div class="input-group">
                <label>Mensaje *</label>
                <textarea id="msg" rows="5"></textarea>
            </div>
            <button class="btn-submit" onclick="enviar()">ENVIAR MENSAJE</button>
        </div>

        <div class="info-side">
            <h3>INCOREA CABLES</h3>
            <p>Dirección:<br>Quito, Ecuador</p>
            
            <h3>NEGOCIOS</h3>
            <p>ventas@incorea.com<br>+593 99 999 9999</p>
        </div>
    </div>
    
    <div id="footer"><p>&copy; 2026 INCOREA CABLES</p></div>
</div>

<script>
    function enviar() {
        alert("Mensaje enviado. Nos pondremos en contacto pronto.");
        location.reload();
    }
</script>
</body>
</html>
