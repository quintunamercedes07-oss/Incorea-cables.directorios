<!DOCTYPE HTML PUBLIC "-//W3C//DTD HTML 4.01 Transitional//EN" "http://www.w3.org/TR/html4/loose.dtd">
<html>
<head>
<meta http-equiv="Content-Type" content="text/html; charset=utf-8">
<title>Comentarios - INCOREA CABLES</title>
<link href="estilos.css" rel="stylesheet" type="text/css">
<style>
    body { font-family: sans-serif; background: #0e161d; color: white; margin: 0; }
    .container { margin: 20px 5%; min-height: 400px; }
    
    /* ESTILO DE COMENTARIOS INDIVIDUALES */
    .comentario-box { 
        background: rgba(255, 255, 255, 0.03); 
        padding: 15px; 
        border-radius: 8px; 
        margin-bottom: 15px; 
        border-left: 3px solid #1abc9c;
    }
    .comentario-texto { font-size: 15px; color: #eee; line-height: 1.4; }
    .comentario-fecha { font-size: 10px; color: #555; margin-top: 8px; text-transform: uppercase; }

    /* AREA DE ENVÍO */
    .enviar-zona { 
        background: #0a0f14; 
        padding: 30px 5%; 
        border-top: 1px solid #1abc9c33; 
        text-align: center; 
    }
    textarea { 
        width: 100%; max-width: 600px; height: 80px; 
        background: #111; border: 1px solid #333; 
        color: white; padding: 12px; border-radius: 6px; 
        font-family: inherit; margin-bottom: 10px; outline: none;
    }
    textarea:focus { border-color: #1abc9c; }
    
    .btn-enviar { 
        background: #1abc9c; color: #0e161d; border: none; 
        padding: 10px 25px; border-radius: 4px; font-weight: bold; 
        cursor: pointer; transition: 0.3s; 
    }
    .btn-enviar:hover { background: #16a085; }

    /* ADMIN DISCRETO */
    .admin-del { color: #e74c3c; font-size: 10px; cursor: pointer; margin-top: 10px; display: inline-block; }
    .admin-del:hover { text-decoration: underline; }
</style>
</head>

<body>
<div id="wrapper">
    <div id="header">
        <div id="logo-container"><img src="logo de la empresa.png" id="logo-imagen"></div>
        <div id="titulo-container">
            <h1>INCOREA CABLES</h1>
            <p>Muro de Comentarios</p>
        </div>
    </div>

    <div id="nav">
        <a href="index.html">INICIO</a>
        <a href="directorio.html">DIRECTORIO</a>
        <a href="servicios.html">SERVICIOS</a>
        <a href="sugerencias.html">SUGERENCIAS</a>
        <a href="comentarios.html">COMENTARIOS</a>
    </div>

    <div class="container" id="muro"></div>

    <div class="enviar-zona">
        <textarea id="msg" placeholder="Escribe tu comentario aquí..."></textarea>
        <br>
        <button class="btn-enviar" onclick="enviarComentario()">PUBLICAR COMENTARIO</button>
    </div>
    
    <div id="footer"><p>&copy; 2026 INCOREA CABLES</p></div>
</div>

<script>
const URL = "https://httpsincorea-cables-default-rtdb.firebaseio.com/solo_comentarios";
const KEY = "1234";

window.onload = cargarComentarios;

async function cargarComentarios() {
    const res = await fetch(`${URL}.json`);
    const data = await res.json();
    const muro = document.getElementById('muro');
    muro.innerHTML = "";

    if(!data) {
        muro.innerHTML = "<p style='color:#444; text-align:center;'>No hay comentarios aún. ¡Sé el primero!</p>";
        return;
    }

    // Mostrar de más nuevo a más viejo
    Object.keys(data).reverse().forEach(id => {
        const c = data[id];
        muro.innerHTML += `
            <div class="comentario-box">
                <div class="comentario-texto">${c.texto}</div>
                <div class="comentario-fecha">${c.fecha}</div>
                <span class="admin-del" onclick="borrarComentario('${id}')">[ Eliminar ]</span>
            </div>
        `;
    });
}

async function enviarComentario() {
    const txt = document.getElementById('msg').value;
    if(!txt.trim()) return alert("Escribe algo antes de enviar.");

    const nuevoComentario = {
        texto: txt,
        fecha: new Date().toLocaleString()
    };

    await fetch(`${URL}.json`, {
        method: 'POST',
        body: JSON.stringify(nuevoComentario)
    });

    document.getElementById('msg').value = "";
    cargarComentarios();
}

async function borrarComentario(id) {
    if(prompt("Clave de administrador:") === KEY) {
        await fetch(`${URL}/${id}.json`, { method: 'DELETE' });
        cargarComentarios();
    }
}
</script>
</body>
</html>
