<!DOCTYPE HTML PUBLIC "-//W3C//DTD HTML 4.01 Transitional//EN" "http://www.w3.org/TR/html4/loose.dtd">
<html>
<head>
<meta http-equiv="Content-Type" content="text/html; charset=iso-8859-1">
<title>INCOREA CABLES-comentarios</title>
<link href="estilos.css" rel="stylesheet" type="text/css">
<style>
    .tabla-gestion {
        width: 100%;
        border-collapse: collapse;
        color: #ecf0f1;
        font-family: 'Segoe UI', Roboto, sans-serif;
    }
    .tabla-gestion th {
        background: #1c2b3a;
        color: #1abc9c;
        padding: 18px;
        text-transform: uppercase;
        font-size: 13px;
        letter-spacing: 1px;
        border-bottom: 2px solid #1abc9c;
        text-align: left;
    }
    .tabla-gestion td {
        padding: 18px;
        border-bottom: 1px solid rgba(255, 255, 255, 0.05);
        vertical-align: middle;
    }
    .fila-dinamica {
        transition: background 0.3s ease;
    }
    .fila-dinamica:hover {
        background: rgba(26, 188, 156, 0.05);
    }
    .badge {
        padding: 6px 14px;
        border-radius: 20px;
        font-size: 11px;
        font-weight: bold;
        letter-spacing: 1px;
        display: inline-block;
    }
    .recibido { 
        background: rgba(241, 196, 15, 0.15); 
        color: #f1c40f; 
        border: 1px solid #f1c40f;
    }
    .visto { 
        background: rgba(46, 204, 113, 0.15); 
        color: #2ecc71; 
        border: 1px solid #2ecc71;
    }
    .btn-ver {
        background: #1abc9c;
        color: white;
        border: none;
        padding: 8px 16px;
        border-radius: 6px;
        cursor: pointer;
        font-weight: bold;
        font-size: 12px;
        transition: all 0.3s ease;
        text-decoration: none;
        display: inline-flex;
        align-items: center;
        gap: 5px;
    }
    .btn-ver:hover {
        background: #17d3ad;
        box-shadow: 0 4px 12px rgba(26, 188, 156, 0.3);
        transform: translateY(-1px);
    }
    .btn-borrar {
        background: transparent;
        color: #e74c3c;
        border: 1px solid #e74c3c;
        padding: 8px 16px;
        border-radius: 6px;
        cursor: pointer;
        font-weight: bold;
        font-size: 12px;
        transition: all 0.3s ease;
    }
    .btn-borrar:hover {
        background: #e74c3c;
        color: white;
        box-shadow: 0 4px 12px rgba(231, 76, 60, 0.2);
    }
</style>
</head>
<body>
<div id="wrapper">
    <div id="header">
        <div id="logo-container"><img src="logo de la empresa.png" id="logo-imagen" alt="Logo"></div>
        <div id="titulo-container">
            <h1>Calidad que conecta tus proyectos</h1>
            <p>Estamos para ayudarte</p>
        </div>
    </div>
    
    <div id="nav">
        <a href="index.html">INICIO</a>
        <a href="directorio.html">DIRECTORIO</a>
        <a href="servicios.html">SERVICIOS</a>
        <a href="sugerencias.html">SUGERENCIAS</a>
        <a href="comentarios.html">COMENTARIO</a>
    </div>

    <div id="comentarios-container" style="padding: 60px 5%;">
        <div class="comentarios-header" style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 30px; border-bottom: 2px solid #1c2b3a; padding-bottom: 20px;">
            <h2 style="color: #ffffff; letter-spacing: 1px; margin: 0; font-family: 'Segoe UI', sans-serif; font-weight: 800; font-size: 28px;">BANDEJA DE CONTROL</h2>
            <button onclick="borrarHistorial()" class="btn-borrar">LIMPIAR REGISTROS</button>
        </div>

        <div class="tabla-wrapper" style="background: rgba(44, 62, 80, 0.2); backdrop-filter: blur(12px); border-radius: 16px; overflow: hidden; border: 1px solid rgba(255,255,255,0.05);">
            <table class="tabla-gestion">
                <thead>
                    <tr>
                        <th>ÁREA /REMITENTE</th>
                        <th>DETALLE OPERATIVO</th>
                        <th>ESTADO</th>
                        <th style="width: 150px; text-align: center;">ACCIÓN</th>
                    </tr>
                </thead>
                <tbody id="tabla-body">
                </tbody>
            </table>
        </div>
    </div>

    <script>
        const CLAVE_ADMIN_COMENTARIOS = "12345";

        function cargarComentariosDinamicos() {
            const datos = localStorage.getItem('datosIncorea');
            let lista = JSON.parse(datos) || [];
            const cuerpoTabla = document.getElementById('tabla-body');    
            if (!cuerpoTabla) return;
            cuerpoTabla.innerHTML = '';
            
            if (lista.length === 0) {
                cuerpoTabla.innerHTML = '<tr><td colspan="4" style="text-align:center; padding: 100px; color: #bdc3c7; font-style: italic; font-size: 14px;">No existen nuevas solicitudes o reportes en la bandeja de control.</td></tr>';
                return;    
            }
            
            lista.forEach((item, index) => {
                let fila = document.createElement('tr');
                fila.className = 'fila-dinamica';
                
                const claseBadge = item.estado === 'RECIBIDO' ? 'recibido' : 'visto';
                
                // Extraer el nombre real del documento omitiendo la etiqueta de la carpeta para redirigir con precisión
                let archivoBuscado = item.area;
                if (item.area.includes(']')) {
                    archivoBuscado = item.area.split(']')[1].trim();
                }

                fila.innerHTML = `
                    <td>
                        <strong style="color: #ffffff; font-size: 15px; font-weight: 700;">${item.area}</strong><br>
                        <small style="color: #1abc9c; font-weight: 600; letter-spacing: 0.5px;">${item.usuario}</small>
                    </td>
                    <td style="color: #bdc3c7; font-size: 14px; line-height: 1.5;">"${item.mensaje}"</td>
                    <td><span class="badge ${claseBadge}">${item.estado}</span></td>
                    <td style="text-align: center;">
                        <button onclick="marcarYRedirigir(${index}, '${encodeURIComponent(archivoBuscado)}')" class="btn-ver">
                             VER TARJETA
                        </button>
                    </td>
                `;
                cuerpoTabla.appendChild(fila);
            });
        }

        function marcarYRedirigir(index, documentoCodificado) {
            const datos = localStorage.getItem('datosIncorea');
            let lista = JSON.parse(datos) || [];
            
            // Cambiar estado a VISTO
            lista[index].estado = 'VISTO'; 
            localStorage.setItem('datosIncorea', JSON.stringify(lista));
            
            // Redirigir a directorio pasando el nombre específico del archivo para resaltar
            window.location.href = 'directorio.html?resaltar=' + documentoCodificado;
        }

        function borrarHistorial() {
            const password = prompt("Ingresa la clave de administrador para limpiar la bandeja:");
            if (password === CLAVE_ADMIN_COMENTARIOS) {
                if (confirm('¿Confirmas que deseas vaciar todos los registros del sistema?')) {
                    localStorage.removeItem('datosIncorea');
                    cargarComentariosDinamicos(); 
                    alert("Bandeja vaciada correctamente.");
                }
            } else {
                alert("Clave incorrecta. Acción cancelada.");
            }
        }
        
        window.onload = cargarComentariosDinamicos; 
    </script>

    <div id="footer" style="clear: both; padding: 40px; text-align: center; background: #0e161d; border-top: 4px solid #1abc9c;">
        <p>INCOREA-CABLES</p>
    </div>
</div>
</body>
</html>
