<!DOCTYPE HTML PUBLIC "-//W3C//DTD HTML 4.01 Transitional//EN" "http://www.w3.org/TR/html4/loose.dtd">
<html>
<head>
<meta http-equiv="Content-Type" content="text/html; charset=iso-8859-1">
<title>INCOREA CABLES-comentarios</title>
<link href="estilos.css" rel="stylesheet" type="text/css">
<style>
    .tabla-gestion {
        width: 100%;
        border-collapse: collapse;
        color: #ecf0f1;
        font-family: 'Segoe UI', Roboto, sans-serif;
    }
    .tabla-gestion th {
        background: #1c2b3a;
        color: #1abc9c;
        padding: 18px;
        text-transform: uppercase;
        font-size: 13px;
        letter-spacing: 1px;
        border-bottom: 2px solid #1abc9c;
        text-align: left;
    }
    .tabla-gestion td {
        padding: 18px;
        border-bottom: 1px solid rgba(255, 255, 255, 0.05);
        vertical-align: middle;
    }
    .fila-dinamica {
        transition: background 0.3s ease;
    }
    .fila-dinamica:hover {
        background: rgba(26, 188, 156, 0.05);
    }
    .badge {
        padding: 6px 14px;
        border-radius: 20px;
        font-size: 11px;
        font-weight: bold;
        letter-spacing: 1px;
        display: inline-block;
    }
    .recibido { 
        background: rgba(241, 196, 15, 0.15); 
        color: #f1c40f; 
        border: 1px solid #f1c40f;
    }
    .visto { 
        background: rgba(46, 204, 113, 0.15); 
        color: #2ecc71; 
        border: 1px solid #2ecc71;
    }
    .btn-ver {
        background: #1abc9c;
        color: white;
        border: none;
        padding: 8px 16px;
        border-radius: 6px;
        cursor: pointer;
        font-weight: bold;
        font-size: 12px;
        transition: all 0.3s ease;
        text-decoration: none;
        display: inline-flex;
        align-items: center;
        gap: 5px;
    }
    .btn-ver:hover {
        background: #17d3ad;
        box-shadow: 0 4px 12px rgba(26, 188, 156, 0.3);
        transform: translateY(-1px);
    }
    .btn-borrar {
        background: transparent;
        color: #e74c3c;
        border: 1px solid #e74c3c;
        padding: 8px 16px;
        border-radius: 6px;
        cursor: pointer;
        font-weight: bold;
        font-size: 12px;
        transition: all 0.3s ease;
    }
    .btn-borrar:hover {
        background: #e74c3c;
        color: white;
        box-shadow: 0 4px 12px rgba(231, 76, 60, 0.2);
    }
</style>
</head>
<body>
<div id="wrapper">
    <div id="header">
        <div id="logo-container"><img src="logo de la empresa.png" id="logo-imagen" alt="Logo"></div>
        <div id="titulo-container">
            <h1>Calidad que conecta tus proyectos</h1>
            <p>Estamos para ayudarte</p>
        </div>
    </div>
    
    <div id="nav">
        <a href="index.html">INICIO</a>
        <a href="directorio.html">DIRECTORIO</a>
        <a href="servicios.html">SERVICIOS</a>
        <a href="sugerencias.html">SUGERENCIAS</a>
        <a href="comentarios.html">COMENTARIO</a>
    </div>

    <div id="comentarios-container" style="padding: 60px 5%;">
        <div class="comentarios-header" style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 30px; border-bottom: 2px solid #1c2b3a; padding-bottom: 20px;">
            <h2 style="color: #ffffff; letter-spacing: 1px; margin: 0; font-family: 'Segoe UI', sans-serif; font-weight: 800; font-size: 28px;">BANDEJA DE CONTROL</h2>
            <button onclick="borrarHistorial()" class="btn-borrar">LIMPIAR REGISTROS</button>
        </div>

        <div class="tabla-wrapper" style="background: rgba(44, 62, 80, 0.2); backdrop-filter: blur(12px); border-radius: 16px; overflow: hidden; border: 1px solid rgba(255,255,255,0.05);">
            <table class="tabla-gestion">
                <thead>
                    <tr>
                        <th>ÁREA / REMITENTE</th>
                        <th>DETALLE OPERATIVO</th>
                        <th>ESTADO</th>
                        <th style="width: 150px; text-align: center;">ACCIÓN</th>
                    </tr>
                </thead>
                <tbody id="tabla-body">
                    <tr>
                        <td colspan="4" style="text-align:center; padding: 100px; color: #bdc3c7; font-style: italic; font-size: 14px;">Cargando registros desde el servidor remoto...</td>
                    </tr>
                </tbody>
            </table>
        </div>
    </div>

    <script>
        const CLAVE_ADMIN_COMENTARIOS = "12345";
        const FIREBASE_URL = "https://httpsincorea-cables-default-rtdb.firebaseio.com/datosIncorea.json";

        // Objeto global para almacenar los comentarios estructurados por su ID de Firebase
        let comentariosGlobales = {};

        // CARGAR COMENTARIOS DESDE FIREBASE
        function cargarComentariosDinamicos() {
            const cuerpoTabla = document.getElementById('tabla-body');    
            if (!cuerpoTabla) return;

            fetch(FIREBASE_URL)
                .then(response => response.json())
                .then(data => {
                    cuerpoTabla.innerHTML = '';
                    
                    // Si no hay datos (null), mostrar que la bandeja está vacía
                    if (!data) {
                        cuerpoTabla.innerHTML = '<tr><td colspan="4" style="text-align:center; padding: 100px; color: #bdc3c7; font-style: italic; font-size: 14px;">No existen nuevas solicitudes o reportes en la bandeja de control.</td></tr>';
                        return;    
                    }

                    comentariosGlobales = data;

                    // Convertir el objeto de Firebase en una lista y procesarla
                    Object.keys(data).forEach((idFirebase) => {
                        const item = data[idFirebase];
                        let fila = document.createElement('tr');
                        fila.className = 'fila-dinamica';
                        
                        const claseBadge = item.estado === 'RECIBIDO' ? 'recibido' : 'visto';
                        
                        // Extraer el nombre real del documento omitiendo la etiqueta de la carpeta para redirigir
                        let archivoBuscado = item.area;
                        if (item.area && item.area.includes(']')) {
                            archivoBuscado = item.area.split(']')[1].trim();
                        }

                        fila.innerHTML = `
                            <td>
                                <strong style="color: #ffffff; font-size: 15px; font-weight: 700;">${item.area || 'Sin Área'}</strong><br>
                                <small style="color: #1abc9c; font-weight: 600; letter-spacing: 0.5px;">${item.usuario || 'Anónimo'}</small>
                            </td>
                            <td style="color: #bdc3c7; font-size: 14px; line-height: 1.5;">"${item.mensaje || ''}"</td>
                            <td><span class="badge ${claseBadge}">${item.estado || 'RECIBIDO'}</span></td>
                            <td style="text-align: center;">
                                <button onclick="marcarYRedirigir('${idFirebase}', '${encodeURIComponent(archivoBuscado)}')" class="btn-ver">
                                     VER TARJETA
                                </button>
                            </td>
                        `;
                        cuerpoTabla.appendChild(fila);
                    });
                })
                .catch(error => {
                    console.error("Error al conectar con Firebase:", error);
                    cuerpoTabla.innerHTML = '<tr><td colspan="4" style="text-align:center; padding: 100px; color: #e74c3c; font-style: italic; font-size: 14px;">Error de conexión con el servidor. Por favor, verifica tu conexión a internet.</td></tr>';
                });
        }

        // MARCAR REGISTRO COMO VISTO EN FIREBASE Y LUEGO REDIRIGIR
        function marcarYRedirigir(idFirebase, documentoCodificado) {
            const urlUpdate = `https://httpsincorea-cables-default-rtdb.firebaseio.com/datosIncorea/${idFirebase}.json`;

            // Enviar actualización de estado ("VISTO") a Firebase
            fetch(urlUpdate, {
                method: "PATCH",
                headers: {
                    "Content-Type": "application/json"
                },
                body: JSON.stringify({ estado: "VISTO" })
            })
            .then(response => {
                if (response.ok) {
                    // Redirigir a directorio pasando el nombre específico del archivo para resaltar
                    window.location.href = 'directorio.html?resaltar=' + documentoCodificado;
                } else {
                    alert("Error al actualizar el estado de la sugerencia.");
                }
            })
            .catch(error => {
                console.error("Error en la petición PATCH:", error);
                // Si falla la red, redirigimos de todas formas
                window.location.href = 'directorio.html?resaltar=' + documentoCodificado;
            });
        }

        // ELIMINAR TODO EL HISTORIAL DE COMENTARIOS EN FIREBASE
        function borrarHistorial() {
            const password = prompt("Ingresa la clave de administrador para limpiar la bandeja:");
            if (password === CLAVE_ADMIN_COMENTARIOS) {
                if (confirm('¿Confirmas que deseas vaciar todos los registros del sistema? Esto eliminará permanentemente los datos en Firebase.')) {
                    
                    fetch(FIREBASE_URL, {
                        method: "DELETE"
                    })
                    .then(response => {
                        if (response.ok) {
                            alert("Bandeja vaciada correctamente en el servidor.");
                            cargarComentariosDinamicos(); 
                        } else {
                            alert("No se pudo vaciar la bandeja en el servidor.");
                        }
                    })
                    .catch(error => {
                        console.error("Error al borrar registros:", error);
                        alert("Error de conexión al intentar vaciar la bandeja.");
                    });
                }
            } else {
                alert("Clave incorrecta. Acción cancelada.");
            }
        }
        
        window.onload = cargarComentariosDinamicos; 
    </script>

    <div id="footer" style="clear: both; padding: 40px; text-align: center; background: #0e161d; border-top: 4px solid #1abc9c;">
        <p>INCOREA-CABLES</p>
    </div>
</div>
</body>
</html>
