<!DOCTYPE HTML PUBLIC "-//W3C//DTD HTML 4.01 Transitional//EN" "http://www.w3.org/TR/html4/loose.dtd">
<html>
<head>
<meta http-equiv="Content-Type" content="text/html; charset=iso-8859-1">
<title>INCOREA CABLES-Directorio</title>
<link href="estilos.css" rel="stylesheet" type="text/css">
<style>
    /* CONTENEDOR DE CARPETAS */
    .contenedor-carpetas {
        display: flex;
        flex-direction: column;
        gap: 20px;
        margin-top: 30px;
        font-family: 'Segoe UI', Roboto, sans-serif;
    }

    /* DISEÑO DE LA CABECERA DE LA CARPETA */
    .carpeta-header {
        background: rgba(28, 43, 58, 0.9);
        border: 2px solid rgba(26, 188, 156, 0.4);
        border-radius: 10px;
        padding: 22px 30px;
        display: flex;
        justify-content: space-between;
        align-items: center;
        cursor: pointer;
        transition: all 0.3s ease;
        user-select: none;
    }
    .carpeta-header:hover {
        background: rgba(34, 53, 72, 0.95);
        border-color: #1abc9c;
        box-shadow: 0 6px 20px rgba(26, 188, 156, 0.15);
    }
    .carpeta-titulo {
        display: flex;
        align-items: center;
        gap: 15px;
        color: #ffffff;
        font-size: 22px;
        font-weight: 800;
    }
    .carpeta-icono-estado {
        color: #1abc9c;
        font-size: 18px;
        transition: transform 0.3s ease;
    }
    .carpeta-icono-estado::after {
        content: "▶";
        display: inline-block;
    }

    /* CONTENEDOR DE TARJETAS DENTRO DE LA CARPETA */
    .carpeta-contenido {
        max-height: 0;
        overflow: hidden;
        transition: max-height 0.4s cubic-bezier(0.165, 0.84, 0.44, 1);
        display: flex;
        flex-direction: column;
        gap: 12px;
        padding-left: 20px;
        border-left: 3px dashed rgba(26, 188, 156, 0.3);
        margin-left: 12px;
    }

    .carpeta-abierta .carpeta-contenido {
        max-height: 1500px;
        margin-top: 15px;
        margin-bottom: 20px;
    }
    .carpeta-abierta .carpeta-icono-estado {
        transform: rotate(90deg);
    }

    /* TARJETA INDIVIDUAL DE DOCUMENTO */
    .tarjeta-horizontal {
        background: rgba(17, 29, 40, 0.75);
        backdrop-filter: blur(16px);
        -webkit-backdrop-filter: blur(16px);
        border: 1px solid rgba(255, 255, 255, 0.08);
        border-radius: 12px;
        padding: 18px 25px;
        display: flex;
        align-items: center;
        justify-content: space-between;
        transition: all 0.3s ease;
    }
    .tarjeta-horizontal:hover {
        border-color: rgba(26, 188, 156, 0.5);
        background: rgba(22, 37, 51, 0.85);
        transform: translateX(5px);
    }

    .col-info {
        width: 25%;
        min-width: 180px;
    }
    .col-descripcion {
        flex: 1;
        padding: 0 25px;
        color: #ecf0f1;
        font-size: 15px;
        line-height: 1.5;
    }
    .col-acciones {
        display: flex;
        align-items: center;
        gap: 12px;
        width: 20%;
        justify-content: flex-end;
        min-width: 200px;
    }

    /* BOTONES */
    .btn-abrir-moderno {
        background: linear-gradient(135deg, #1abc9c 0%, #16a085 100%);
        color: white;
        border: none;
        padding: 10px 22px;
        border-radius: 8px;
        cursor: pointer;
        font-weight: 700;
        font-size: 12px;
        letter-spacing: 0.5px;
        transition: all 0.3s ease;
    }
    .btn-abrir-moderno:hover {
        background: linear-gradient(135deg, #17d3ad 0%, #1abc9c 100%);
        transform: scale(1.04);
    }

    /* VISOR DE SEGURIDAD */
    #panel-visor-protegido {
        display: none;
        position: fixed;
        top: 0; left: 0; width: 100%; height: 100%;
        background: #0e161d;
        z-index: 10000;
    }
    .barra-visor {
        height: 50px;
        background: #1a252f;
        display: flex;
        justify-content: space-between;
        align-items: center;
        padding: 0 20px;
        border-bottom: 3px solid #1abc9c;
    }
    .btn-cerrar {
        background: #e74c3c;
        color: white;
        border: none;
        padding: 8px 15px;
        border-radius: 5px;
        cursor: pointer;
        font-weight: bold;
    }
    .iframe-seguro {
        width: 100%;
        height: calc(100% - 50px);
        border: none;
    }

    /* EFECTO DE BRILLO EXTREMO */
    @keyframes superBrilloNeon {
        0% {
            border-color: #1abc9c;
            box-shadow: 0 0 15px rgba(26, 188, 156, 0.2), inset 0 0 10px rgba(26, 188, 156, 0.05);
            transform: translateY(-1px);
        }
        50% {
            border-color: #17d3ad;
            box-shadow: 0 0 35px #1abc9c, inset 0 0 20px rgba(26, 188, 156, 0.4);
            transform: translateY(-4px);
        }
        100% {
            border-color: #1abc9c;
            box-shadow: 0 0 15px rgba(26, 188, 156, 0.2), inset 0 0 10px rgba(26, 188, 156, 0.05);
            transform: translateY(-1px);
        }
    }
    .tarjeta-brillante {
        animation: superBrilloNeon 1.8s infinite ease-in-out !important;
        border-width: 1.5px !important;
        background: rgba(26, 188, 156, 0.08) !important;
    }
</style>

<script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-app.js"></script>
<script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-database.js"></script>

</head>
<body>
<div id="wrapper">
    <div id="header">
        <div id="logo-container"><img src="logo de la empresa.png" id="logo-imagen" alt="Logo"></div>
        <div id="titulo-container">
            <h1>Calidad que conecta tus proyectos</h1>
            <p>Estamos para ayudarte</p>
        </div>
    </div>

    <div id="nav">
        <a href="index.html">INICIO</a>
        <a href="directorio.html">DIRECTORIO</a>
        <a href="servicios.html">SERVICIOS</a>
        <a href="sugerencias.html">SUGERENCIAS</a>
        <a href="comentarios.html">COMENTARIO</a>
    </div>

    <div id="comentarios-container" style="padding: 60px 5%;">
        <div class="comentarios-header" style="border-bottom: 2px solid #1c2b3a; padding-bottom: 20px; margin-bottom: 30px;">
            <h2 style="color: #ffffff; letter-spacing: 1.5px; margin: 0; font-family: 'Segoe UI', sans-serif; font-weight: 800; font-size: 32px;">ESTRUCTURA DE ARCHIVOS</h2>
            <p style="color: #1abc9c; margin-top: 5px; font-weight: 600; letter-spacing: 0.8px; font-size: 15px;">SELECCIONA UNA CARPETA DE LOS DOCUMENTOS</p>
        </div>

        <div id="contenedor-carpetas-dinamico" class="contenedor-carpetas">
            </div>
    </div>

    <div id="panel-visor-protegido">
        <div class="barra-visor">
            <span style="color: #1abc9c; font-weight: bold; font-family: sans-serif;">MODO LECTURA PROTEGIDO</span>
            <button onclick="cerrarVisor()" class="btn-cerrar">CERRAR</button>
        </div>
        <iframe src="" id="visor-iframe" class="iframe-seguro"></iframe>
    </div>

    <div id="footer" style="clear: both; padding: 40px; text-align: center; background: #0e161d; border-top: 4px solid #1abc9c;">
        <p>INCOREA-CABLES</p>
    </div>
</div>

<script>
// CONFIGURACIÓN DE FIREBASE (Reemplaza con tus credenciales reales)
const firebaseConfig = {
    apiKey: "TU_API_KEY",
    authDomain: "TU_AUTH_DOMAIN",
    databaseURL: "https://TU_BASE_DE_DATOS.firebaseio.com",
    projectId: "TU_PROJECT_ID",
    storageBucket: "TU_STORAGE_BUCKET",
    messagingSenderId: "TU_MESSAGING_SENDER_ID",
    appId: "TU_APP_ID"
};

if (!firebase.apps.length) {
    firebase.initializeApp(firebaseConfig);
}
const dbRef = firebase.database().ref("sistemaCarpetas");
let baseDatos = [];

window.onload = function() {
    escucharBaseDatos();
};

function escucharBaseDatos() {
    dbRef.on('value', (snapshot) => {
        const rawData = snapshot.val();
        if (rawData) {
            baseDatos = Array.isArray(rawData) ? rawData : Object.values(rawData);
        } else {
            baseDatos = [];
        }
        mostrarCarpetasYArchivos();
        chequearResaltado();
    });
}

function mostrarCarpetasYArchivos() {
    const contenedor = document.getElementById('contenedor-carpetas-dinamico');
    contenedor.innerHTML = "";

    const baseDatosLimpios = baseDatos.filter(Boolean);

    if (baseDatosLimpios.length === 0) {
        contenedor.innerHTML = '<div style="text-align:center; padding: 40px; color: #bdc3c7; font-style: italic;">No hay carpetas creadas. Agrégalas desde Servicios.</div>';
        return;
    }

    baseDatosLimpios.forEach((carpeta, indexCarpeta) => {
        let htmlArchivos = "";

        if (!carpeta.archivos) {
            htmlArchivos = `<div style="padding: 15px; color: #7f8c8d; font-style: italic; font-size: 14px;">Esta carpeta está vacía.</div>`;
        } else {
            const archivosArray = Array.isArray(carpeta.archivos) ? carpeta.archivos : Object.values(carpeta.archivos);
            const archivosLimpios = archivosArray.filter(Boolean);

            if (archivosLimpios.length === 0) {
                htmlArchivos = `<div style="padding: 15px; color: #7f8c8d; font-style: italic; font-size: 14px;">Esta carpeta está vacía.</div>`;
            } else {
                archivosLimpios.forEach((file) => {
                    const idTarjeta = "tarjeta-" + normalizarTexto(file.nombre);
                    htmlArchivos += `
                        <div class="tarjeta-horizontal" id="${idTarjeta}">
                            <div class="col-info">
                                <strong style="color: #ffffff; font-size: 17px; font-weight: 700; display: block;">${file.nombre}</strong>
                            </div>
                            <div class="col-descripcion">
                                "${file.descripcion}"
                            </div>
                            <div class="col-acciones">
                                <button onclick="abrirVisorSeguro('${file.link}')" class="btn-abrir-moderno"> ABRIR</button>
                            </div>
                        </div>`;
                });
            }
        }

        contenedor.innerHTML += `
            <div class="carpeta-grupo" id="grupo-carpeta-${indexCarpeta}">
                <div class="carpeta-header" onclick="alternarCarpeta(this)">
                    <div class="carpeta-titulo">
                        <span>📁</span>
                        <span>${carpeta.nombre}</span>
                    </div>
                    <span class="carpeta-icono-estado"></span>
                </div>
                <div class="carpeta-contenido">
                    ${htmlArchivos}
                </div>
            </div>`;
    });
}

function alternarCarpeta(elementoHeader) {
    const grupo = elementoHeader.parentElement;
    grupo.classList.toggle('carpeta-abierta');
}

function chequearResaltado() {
    const urlParams = new URLSearchParams(window.location.search);
    const areaAResaltar = urlParams.get('resaltar');
    
    if (areaAResaltar) {
        const idBuscado = "tarjeta-" + normalizarTexto(decodeURIComponent(areaAResaltar));
        const elementoTarjeta = document.getElementById(idBuscado);
        
        if (elementoTarjeta) {
            const contenedorCarpetaPadre = elementoTarjeta.closest('.carpeta-grupo');
            if (contenedorCarpetaPadre) {
                contenedorCarpetaPadre.classList.add('carpeta-abierta');
            }
            elementoTarjeta.classList.add('tarjeta-brillante');
            
            setTimeout(() => {
                elementoTarjeta.scrollIntoView({ behavior: 'smooth', block: 'center' });
            }, 400);
        }
    }
}

function normalizarTexto(texto) {
    return texto
        .toLowerCase()
        .normalize("NFD")
        .replace(/[\u0300-\u036f]/g, "")
        .replace(/[^a-z0-9]/g, "-")
        .replace(/-+/g, "-")
        .trim();
}

function abrirVisorSeguro(url) {
    let urlFinal = url;
    if (url.includes("docs.google.com/spreadsheets")) {
        urlFinal = url.split('/edit')[0] + '/preview';
    } 
    else if (url.includes("1drv.ms") || url.includes("onedrive.live.com")) {
        if(!url.includes("embed")) {
            urlFinal = url.replace("redir?", "embed?") + "&wdAllowInteractivity=False&action=embedview";
        } else {
            urlFinal = url + "&wdAllowInteractivity=False&action=embedview";
        }
    }
    const visor = document.getElementById('panel-visor-protegido');
    const iframe = document.getElementById('visor-iframe');
    iframe.src = urlFinal;
    visor.style.display = 'block';
    document.body.style.overflow = 'hidden'; 
}

function cerrarVisor() {
    document.getElementById('panel-visor-protegido').style.display = 'none';
    document.getElementById('visor-iframe').src = "";
    document.body.style.overflow = 'auto'; 
}
</script>
</body>
</html>
