<!DOCTYPE html PUBLIC "-//W3C//DTD HTML 4.01 Transitional//EN" "http://www.w3.org/TR/html4/loose.dtd">
<html>
<head>
    <meta http-equiv="Content-Type" content="text/html; charset=iso-8859-1">
    <title>INCOREA CABLES-Directorio</title>
    <link href="estilos.css" rel="stylesheet" type="text/css">
    
    <style>
        /* ESTILOS ESPECÍFICOS PARA EL DIRECTORIO */
        .contenedor-carpetas {
            display: flex;
            flex-direction: column;
            gap: 20px;
            margin-top: 30px;
        }
        .carpeta-header {
            background-color: #0d1b2a;
            color: #ffffff;
            padding: 15px;
            font-size: 18px;
            font-weight: bold;
            cursor: pointer;
            border-radius: 5px;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }
        .carpeta-contenido {
            display: none;
            padding: 15px;
            background-color: #f8f9fa;
            border: 1px solid #ddd;
            border-top: none;
            border-radius: 0 0 5px 5px;
        }
        .carpeta-abierta .carpeta-contenido {
            display: block;
        }
        .tarjeta-horizontal {
            display: flex;
            justify-content: space-between;
            align-items: center;
            background-color: #ffffff;
            border: 1px solid #e0e0e0;
            padding: 15px;
            margin-bottom: 10px;
            border-radius: 4px;
        }
        .col-info {
            font-size: 16px;
        }
        .col-descripcion {
            font-size: 14px;
            color: #666;
        }
        .btn-abrir-moderno {
            background-color: #ff6b00;
            color: white;
            padding: 10px 15px;
            text-decoration: none;
            font-weight: bold;
            border-radius: 4px;
            display: inline-block;
        }
        .seccion-admin {
            margin-top: 50px;
            padding: 20px;
            background-color: #ffffff;
            border: 1px dashed #0d1b2a;
            border-radius: 5px;
        }
        .grupo-input {
            margin-bottom: 15px;
        }
        .grupo-input label {
            display: block;
            margin-bottom: 5px;
            font-weight: bold;
        }
        .grupo-input input, .grupo-input select {
            width: 100%;
            padding: 8px;
            box-sizing: border-box;
            border: 1px solid #ccc;
            border-radius: 4px;
        }
        .btn-accion {
            background-color: #0d1b2a;
            color: white;
            padding: 10px 20px;
            border: none;
            cursor: pointer;
            font-weight: bold;
            border-radius: 4px;
            width: 100%;
        }
    </style>
</head>
<body>

    <div style="background-color: #0d1b2a; padding: 15px; text-align: center;">
        <a href="directorio.html" style="color: white; margin-right: 20px; text-decoration: none; font-weight: bold;">DIRECTORIO</a>
        <a href="comentarios.html" style="color: white; text-decoration: none; font-weight: bold;">SUGERENCIAS</a>
    </div>

    <h1 style="text-align: center; margin-top: 30px; color: #0d1b2a;">DIRECTORIO DE CABLES INCOREA</h1>

    <div class="contenedor-carpetas" id="contenedor-carpetas">
        <p style="text-align: center; color: gray;">Cargando carpetas desde la base de datos...</p>
    </div>

    <div class="seccion-admin">
        <h2 style="color: #0d1b2a; margin-top: 0;">Administrar Carpetas y Archivos</h2>
        
        <div style="margin-bottom: 25px; padding-bottom: 20px; border-bottom: 1px solid #eee;">
            <h3>Crear Carpeta Nueva</h3>
            <div class="grupo-input">
                <label for="input-nueva-carpeta">Nombre de la Carpeta:</label>
                <input type="text" id="input-nueva-carpeta" placeholder="Ej: 1. CABLES DE COBRE">
            </div>
            <button class="btn-accion" onclick="crearNuevaCarpeta()">Crear Carpeta</button>
        </div>

        <div>
            <h3>Subir Archivo/Documento</h3>
            <div class="grupo-input">
                <label for="select-categoria">Seleccionar Carpeta Destino:</label>
                <select id="select-categoria">
                    <option value="">Cargando carpetas...</option>
                </select>
            </div>
            <div class="grupo-input">
                <label for="input-nombre-doc">Nombre del Documento:</label>
                <input type="text" id="input-nombre-doc" placeholder="Ej: Ficha Técnica Cobre.pdf">
            </div>
            <div class="grupo-input">
                <label for="input-url-doc">Enlace del Documento (URL):</label>
                <input type="text" id="input-url-doc" placeholder="Ej: https://drive.google.com/...">
            </div>
            <button class="btn-accion" style="background-color: #ff6b00;" onclick="subirNuevoArchivo()">Guardar Archivo en la Carpeta</button>
        </div>
    </div>

    <script>
        const FIREBASE_URL = "https://httpsincorea-cables-default-rtdb.firebaseio.com/directorios.json";

        // Obtener datos desde Firebase
        async function obtenerCarpetasDeFirebase() {
            try {
                const respuesta = await fetch(FIREBASE_URL);
                const datos = await respuesta.json();
                if (!datos) return [];
                return Object.keys(datos).map(id => ({
                    id: id,
                    nombre: datos[id].nombre,
                    archivos: datos[id].archivos || []
                }));
            } catch (error) {
                console.error("Error conectando a Firebase:", error);
                return [];
            }
        }

        // Crear una carpeta en Firebase
        async function guardarCarpetaEnFirebase(nuevaCarpeta) {
            try {
                await fetch(FIREBASE_URL, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify(nuevaCarpeta)
                });
                renderizarCarpetas();
            } catch (error) {
                alert("Error al guardar la carpeta.");
            }
        }

        // Guardar archivo dentro de una carpeta en Firebase
        async function guardarArchivoEnFirebase(carpetaId, archivosActualizados) {
            try {
                const urlCarpeta = `https://httpsincorea-cables-default-rtdb.firebaseio.com/directorios/${carpetaId}/archivos.json`;
                await fetch(urlCarpeta, {
                    method: 'PUT',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify(archivosActualizados)
                });
                renderizarCarpetas();
            } catch (error) {
                alert("Error al subir el archivo.");
            }
        }

        // Dibujar las carpetas en la pantalla
        async function renderizarCarpetas() {
            const contenedor = document.getElementById('contenedor-carpetas');
            if (!contenedor) return;

            const sistemaCarpetas = await obtenerCarpetasDeFirebase();
            contenedor.innerHTML = '';

            if (sistemaCarpetas.length === 0) {
                contenedor.innerHTML = '<p style="text-align:center; color:gray;">No hay carpetas creadas. Crea una abajo.</p>';
                actualizarSelectorCarpetas([]);
                return;
            }

            actualizarSelectorCarpetas(sistemaCarpetas);

            sistemaCarpetas.forEach((carpeta) => {
                let grupo = document.createElement('div');
                
                let carpetaDiv = document.createElement('div');
                carpetaDiv.className = 'carpeta-header';
                carpetaDiv.innerHTML = `<span>📁 ${carpeta.nombre}</span> <span>▼</span>`;
                
                let contenidoDiv = document.createElement('div');
                contenidoDiv.className = 'carpeta-contenido';

                if (carpeta.archivos.length === 0) {
                    contenidoDiv.innerHTML = '<p style="color: gray; margin: 0;">Carpeta vacía.</p>';
                } else {
                    carpeta.archivos.forEach(doc => {
                        let tarjeta = document.createElement('div');
                        tarjeta.className = 'tarjeta-horizontal';
                        tarjeta.innerHTML = `
                            <div class="col-info">📄 <strong>${doc.nombre}</strong></div>
                            <div class="col-descripcion">Archivo cargado en el sistema</div>
                            <div>
                                <a href="${doc.url}" target="_blank" class="btn-abrir-moderno">ABRIR</a>
                            </div>
                        `;
                        contenidoDiv.appendChild(tarjeta);
                    });
                }

                grupo.appendChild(carpetaDiv);
                grupo.appendChild(contenidoDiv);

                carpetaDiv.addEventListener('click', () => {
                    grupo.classList.toggle('carpeta-abierta');
                });

                contenedor.appendChild(grupo);
            });
        }

        // Llenar el selector del formulario
        function actualizarSelectorCarpetas(sistemaCarpetas) {
            const select = document.getElementById('select-categoria');
            if (!select) return;
            select.innerHTML = '<option value="">-- Selecciona Carpeta Destino --</option>';
            sistemaCarpetas.forEach(carpeta => {
                let option = document.createElement('option');
                option.value = carpeta.id;
                option.textContent = carpeta.nombre;
                select.appendChild(option);
            });
        }

        // Función del botón Crear Carpeta
        async function crearNuevaCarpeta() {
            const input = document.getElementById('input-nueva-carpeta');
            const nombre = input.value.trim();
            if (!nombre) return alert("Escribe un nombre.");

            const nuevaCarpeta = { nombre: nombre, archivos: [] };
            input.value = '';
            await guardarCarpetaEnFirebase(nuevaCarpeta);
        }

        // Función del botón Subir Archivo
        async function subirNuevoArchivo() {
            const select = document.getElementById('select-categoria');
            const inputNombre = document.getElementById('input-nombre-doc');
            const inputUrl = document.getElementById('input-url-doc');

            const carpetaId = select.value;
            const nombreDoc = inputNombre.value.trim();
            let urlDoc = inputUrl.value.trim();

            if (!carpetaId) return alert("Selecciona una carpeta.");
            if (!nombreDoc) return alert("Escribe el nombre del documento.");
            if (!urlDoc) return alert("Pega un enlace.");

            if (!urlDoc.startsWith('http://') && !urlDoc.startsWith('https://')) {
                urlDoc = 'https://' + urlDoc;
            }

            const sistemaCarpetas = await obtenerCarpetasDeFirebase();
            const carpeta = sistemaCarpetas.find(c => c.id === carpetaId);

            if (!carpeta) return;

            const nuevosArchivos = [...carpeta.archivos, { nombre: nombreDoc, url: urlDoc }];
            inputNombre.value = '';
            inputUrl.value = '';
            
            await guardarArchivoEnFirebase(carpetaId, nuevosArchivos);
        }

        window.onload = renderizarCarpetas;
    </script>
</body>
</html>
