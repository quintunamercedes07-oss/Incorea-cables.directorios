<!DOCTYPE html>
<html>
<head>
    <meta http-equiv="Content-Type" content="text/html; charset=iso-8859-1">
    <title>INCOREA CABLES - Directorio</title>
    <link href="styles.css" rel="stylesheet" type="text/css">
    
    <style>
        /* Estilos básicos para que se vea ordenado y moderno */
        body {
            font-family: Arial, sans-serif;
            background-color: #f4f4f9;
            margin: 0;
            padding: 20px;
        }
        .contenedor-carpetas {
            max-width: 800px;
            margin: 0 auto 30px auto;
            display: flex;
            flex-direction: column;
            gap: 15px;
        }
        .carpeta-header {
            background-color: #002f6c;
            color: white;
            padding: 15px;
            border-radius: 6px;
            cursor: pointer;
            display: flex;
            justify-content: space-between;
            font-weight: bold;
        }
        .carpeta-contenido {
            background-color: white;
            border: 1px solid #ccc;
            border-top: none;
            padding: 15px;
            border-radius: 0 0 6px 6px;
            display: none;
        }
        .carpeta-abierta .carpeta-contenido {
            display: block;
        }
        .tarjeta-horizontal {
            background: #f9f9f9;
            border: 1px solid #eee;
            padding: 12px;
            margin-bottom: 8px;
            border-radius: 4px;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }
        .btn-abrir-moderno {
            background-color: #ff6600;
            color: white;
            padding: 8px 12px;
            text-decoration: none;
            font-weight: bold;
            border-radius: 4px;
            font-size: 12px;
        }
        .seccion-admin {
            max-width: 800px;
            margin: 40px auto;
            background: white;
            padding: 20px;
            border-radius: 8px;
            border: 1px dashed #002f6c;
        }
        .grupo-input {
            margin-bottom: 15px;
        }
        .grupo-input label {
            display: block;
            font-weight: bold;
            margin-bottom: 5px;
        }
        .grupo-input input, .grupo-input select {
            width: 100%;
            padding: 10px;
            border: 1px solid #ccc;
            border-radius: 4px;
            box-sizing: border-box;
        }
        .btn-accion {
            background-color: #002f6c;
            color: white;
            padding: 10px 20px;
            border: none;
            border-radius: 4px;
            cursor: pointer;
            font-weight: bold;
            width: 100%;
        }
        .btn-accion:hover {
            background-color: #001a3e;
        }
    </style>
</head>
<body>

    <h2 style="text-align: center; color: #002f6c;">📁 DIRECTORIO DE CABLES INCOREA</h2>

    <div class="contenedor-carpetas">
        <p style="text-align:center; color:gray;">Cargando carpetas desde internet...</p>
    </div>

    <hr style="max-width: 800px; margin: 40px auto; border: 1px solid #ccc;">

    <div class="seccion-admin">
        <h3 style="color: #002f6c; margin-top: 0;">🛠️ PANEL DE CONTROL (AGREGAR CONTENIDO)</h3>
        
        <div style="margin-bottom: 30px; padding-bottom: 20px; border-bottom: 1px solid #eee;">
            <h4>1. Crear Nueva Carpeta</h4>
            <div class="grupo-input">
                <label>Nombre de la Carpeta:</label>
                <input type="text" id="input-nueva-carpeta" placeholder="Ej: 1. CABLES DE COBRE">
            </div>
            <button class="btn-accion" onclick="crearNuevaCarpeta()">Crear Carpeta</button>
        </div>

        <div>
            <h4>2. Agregar Archivo o Link a una Carpeta</h4>
            <div class="grupo-input">
                <label>Selecciona la Carpeta Destino:</label>
                <select id="select-categoria">
                    <option value="">Cargando carpetas...</option>
                </select>
            </div>
            <div class="grupo-input">
                <label>Nombre del Documento / Archivo:</label>
                <input type="text" id="input-nombre-doc" placeholder="Ej: Ficha Técnica Catálogo.pdf">
            </div>
            <div class="grupo-input">
                <label>Enlace / Link del Archivo (URL de Drive, Dropbox, etc.):</label>
                <input type="text" id="input-url-doc" placeholder="Ej: https://drive.google.com/file/d/...">
            </div>
            <button class="btn-accion" style="background-color: #ff6600;" onclick="subirNuevoArchivo()">Subir Archivo a la Carpeta</button>
        </div>
    </div>

    <script>
        // URL de tu base de datos de Firebase
        const FIREBASE_URL = "https://httpsincorea-cables-default-rtdb.firebaseio.com/directorios.json";

        // 1. Obtener las carpetas desde el internet
        async function obtenerCarpetasDeFirebase() {
            try {
                const respuesta = await fetch(FIREBASE_URL);
                const datos = await respuesta.json();
                
                if (!datos) return [];
                
                // Convertimos el objeto raro de Firebase en una lista limpia
                return Object.keys(datos).map(id => ({
                    id: id,
                    nombre: datos[id].nombre,
                    archivos: datos[id].archivos || []
                }));
            } catch (error) {
                console.error("Error al conectar con Firebase:", error);
                return [];
            }
        }

        // 2. Guardar carpeta nueva en internet
        async function guardarCarpetaEnFirebase(nuevaCarpeta) {
            try {
                await fetch(FIREBASE_URL, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify(nuevaCarpeta)
                });
                renderizarCarpetas();
            } catch (error) {
                alert("Error al guardar la carpeta en la base de datos.");
            }
        }

        // 3. Guardar un nuevo link dentro de la carpeta seleccionada
        async function guardarArchivoEnFirebase(carpetaId, archivosActualizados) {
            try {
                const urlCarpeta = `https://httpsincorea-cables-default-rtdb.firebaseio.com/directorios/${carpetaId}/archivos.json`;
                await fetch(urlCarpeta, {
                    method: 'PUT',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify(archivosActualizados)
                });
                renderizarCarpetas();
            } catch (error) {
                alert("Error al subir el link.");
            }
        }

        // 4. Pintar las carpetas y archivos en la pantalla
        async function renderizarCarpetas() {
            const contenedor = document.querySelector('.contenedor-carpetas');
            if (!contenedor) return;

            const sistemaCarpetas = await obtenerCarpetasDeFirebase();
            contenedor.innerHTML = '';

            if (sistemaCarpetas.length === 0) {
                contenedor.innerHTML = '<p style="text-align:center; color:gray;">No hay carpetas creadas. Usa el panel de abajo para crear una.</p>';
                actualizarSelectorCarpetas([]);
                return;
            }

            // Actualizar la lista desplegable del formulario
            actualizarSelectorCarpetas(sistemaCarpetas);

            // Generar visualmente cada carpeta
            sistemaCarpetas.forEach((carpeta) => {
                let grupoCarpetas = document.createElement('div');
                
                let carpetaDiv = document.createElement('div');
                carpetaDiv.className = 'carpeta-header';
                carpetaDiv.innerHTML = `
                    <span>📁 ${carpeta.nombre}</span>
                    <span>▼</span>
                `;
                
                let contenidoDiv = document.createElement('div');
                contenidoDiv.className = 'carpeta-contenido';

                if (carpeta.archivos.length === 0) {
                    contenidoDiv.innerHTML = '<p style="color: gray; margin: 0;">Esta carpeta no tiene archivos todavía.</p>';
                } else {
                    carpeta.archivos.forEach(doc => {
                        let tarjeta = document.createElement('div');
                        tarjeta.className = 'tarjeta-horizontal';
                        tarjeta.innerHTML = `
                            <div>📄 <strong>${doc.nombre}</strong></div>
                            <div>
                                <a href="${doc.url}" target="_blank" class="btn-abrir-moderno">ABRIR ARCHIVO</a>
                            </div>
                        `;
                        contenidoDiv.appendChild(tarjeta);
                    });
                }

                grupoCarpetas.appendChild(carpetaDiv);
                grupoCarpetas.appendChild(contenidoDiv);

                // Evento para abrir/cerrar carpeta al hacer clic
                carpetaDiv.addEventListener('click', () => {
                    grupoCarpetas.classList.toggle('carpeta-abierta');
                });

                contenedor.appendChild(grupoCarpetas);
            });
        }

        // Actualizar el menú de selección de carpetas
        function actualizarSelectorCarpetas(sistemaCarpetas) {
            const select = document.getElementById('select-categoria');
            if (!select) return;
            select.innerHTML = '<option value="">-- Selecciona Carpeta Destino --</option>';
            sistemaCarpetas.forEach(carpeta => {
                let option = document.createElement('option');
                option.value = carpeta.id;
                option.textContent = carpeta.nombre;
                select.appendChild(option);
            });
        }

        // BOTÓN: Crear carpeta
        async function crearNuevaCarpeta() {
            const inputNombre = document.getElementById('input-nueva-carpeta');
            const nombre = inputNombre.value.trim();
            if (!nombre) return alert("Por favor escribe un nombre para la carpeta.");

            const nuevaCarpeta = {
                nombre: nombre,
                archivos: []
            };

            inputNombre.value = '';
            await guardarCarpetaEnFirebase(nuevaCarpeta);
        }

        // BOTÓN: Subir link de archivo
        async function subirNuevoArchivo() {
            const select = document.getElementById('select-categoria');
            const inputNombreDoc = document.getElementById('input-nombre-doc');
            const inputUrlDoc = document.getElementById('input-url-doc');

            const carpetaId = select.value;
            const nombreDoc = inputNombreDoc.value.trim();
            let urlDoc = inputUrlDoc.value.trim();

            if (!carpetaId) return alert("Debes seleccionar una carpeta de la lista.");
            if (!nombreDoc) return alert("Escribe el nombre del documento.");
            if (!urlDoc) return alert("Pega un enlace o link válido.");

            // Asegurar que el link empiece con http si no lo tiene
            if (!urlDoc.startsWith('http://') && !urlDoc.startsWith('https://')) {
                urlDoc = 'https://' + urlDoc;
            }

            const sistemaCarpetas = await obtenerCarpetasDeFirebase();
            const carpetaSeleccionada = sistemaCarpetas.find(c => c.id === carpetaId);

            if (!carpetaSeleccionada) return;

            // Agregamos el archivo a la lista que ya existía
            const nuevosArchivos = [...carpetaSeleccionada.archivos, { nombre: nombreDoc, url: urlDoc }];

            inputNombreDoc.value = '';
            inputUrlDoc.value = '';
            
            await guardarArchivoEnFirebase(carpetaId, nuevosArchivos);
        }

        // Cargar todo al abrir la página
        window.onload = renderizarCarpetas;
    </script>
</body>
</html>
