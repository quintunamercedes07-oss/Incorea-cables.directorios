<!DOCTYPE HTML>
<html lang="es">
<head>
<meta charset="utf-8">
<title>INCOREA CABLES</title>
<link href="estilos.css" rel="stylesheet" type="text/css">
<style>
    body { font-family: sans-serif; background: #0e161d; color: white; margin: 0; }
    .container { margin: 20px 5%; min-height: 300px; }
    
    /* VISTA PÚBLICA */
    .rama { margin-bottom: 25px; }
    .rama-t { color: #1abc9c; font-size: 18px; font-weight: bold; border-bottom: 1px solid #333; padding-bottom: 5px; }
    .archivo { padding: 8px 0 8px 20px; border-left: 1px solid #1abc9c33; margin: 5px 0; }
    .archivo a { color: #eee; text-decoration: none; font-size: 15px; transition: 0.3s; }
    .archivo a:hover { color: #1abc9c; padding-left: 5px; }

    /* PANEL ADMIN */
    .admin-zona { 
        background: rgba(255, 255, 255, 0.02); 
        padding: 20px 5%; 
        border-top: 1px solid #1a252f; 
        margin-top: 60px; 
        transition: 0.5s;
    }
    .admin-zona:hover { background: rgba(255, 255, 255, 0.05); }
    .inputs { display: flex; gap: 8px; flex-wrap: wrap; margin-bottom: 12px; justify-content: center; }
    
    input, select { 
        background: transparent; 
        border: 1px solid #333; 
        color: #ccc; 
        padding: 6px 10px; 
        border-radius: 4px; 
        font-size: 11px; 
        outline: none; 
    }
    input:focus { border-color: #1abc9c; color: white; }

    button { 
        background: transparent; 
        border: 1px solid #1abc9c; 
        color: #1abc9c; 
        padding: 6px 12px; 
        cursor: pointer; 
        border-radius: 4px; 
        font-size: 10px; 
        transition: 0.3s; 
    }
    button:hover { background: #1abc9c; color: #0e161d; }
    
    #gestion { 
        display: none; 
        margin-top: 20px; 
        border-top: 1px dashed #222; 
        padding-top: 15px; 
        max-width: 800px; 
        margin: 20px auto; 
    }
    .edit-item { display: flex; justify-content: space-between; padding: 6px 0; font-size: 11px; border-bottom: 1px solid #1a252f; align-items: center; color: #888; }
    .clic-edit { cursor: pointer; flex: 1; }
    .clic-edit:hover { color: #1abc9c; }
    .btn-x { background: transparent; border: 1px solid #e74c3c; color: #e74c3c; padding: 2px 6px; font-size: 9px; margin-left: 10px; }
    .btn-x:hover { background: #e74c3c; color: white; }
</style>
</head>

<body>
<div id="wrapper">
    <div id="header">
        <div id="logo-container"><img src="logo de la empresa.png" id="logo-imagen" alt="Logo"></div>
        <div id="titulo-container">
            <h1>INCOREA CABLES</h1>
            <p>Directorio de Documentación</p>
        </div>
    </div>

    <div id="nav">
        <a href="index.html">INICIO</a>
        <a href="directorio.html">DIRECTORIO</a>
        <a href="sistemadegestion.html">SISTEMA DE GESTIÓN</a>
        <a href="sugerencias.html">SUGERENCIAS</a>
        <a href="comentarios.html">COMENTARIOS</a>
        <a href="contactos.html">CONTACTOS</a>
    </div>

    <div class="container" id="visor">
        <p style="text-align:center; color:#666;">Cargando archivos...</p>
    </div>

    <div class="admin-zona">
        <div class="inputs">
            <input type="hidden" id="editIdR"> 
            <input type="text" id="rn" placeholder="Nombre de Rama/Carpeta">
            <button onclick="saveR()">GUARDAR CARPETA</button>
            <button onclick="verG()" style="background:#222">GESTIONAR / EDITAR</button>
        </div>
        
        <div class="inputs">
            <input type="hidden" id="editIdF"> 
            <select id="rd"></select>
            <input type="text" id="fn" placeholder="Nombre del Archivo">
            <input type="text" id="fl" placeholder="Link de OneDrive">
            <button onclick="saveF()">GUARDAR ARCHIVO</button>
        </div>

        <div id="gestion">
            <p style="color:#1abc9c; font-size: 11px; text-align: center; margin-bottom: 10px;">
                TOCA UN NOMBRE PARA EDITARLO
            </p>
            <div id="listaG"></div>
        </div>
    </div>
    
    <div id="footer">
        <p>&copy; INCOREA CABLES</p>
    </div>
</div>

<script>
// Asegúrate de que la URL termine SIN barra "/"
const URL_BASE = "https://incorea-cables-default-rtdb.firebaseio.com/sistemaServicios";
const KEY = "1234"; 

window.onload = load;

async function load() {
    try {
        const res = await fetch(`${URL_BASE}.json`);
        const data = await res.json();
        const v = document.getElementById('visor');
        const s = document.getElementById('rd');
        const g = document.getElementById('listaG');
        
        v.innerHTML = ""; g.innerHTML = "";
        s.innerHTML = '<option value="">Seleccionar Carpeta...</option>';

        if(data) {
            Object.keys(data).forEach(idR => {
                const r = data[idR];
                s.innerHTML += `<option value="${idR}">${r.nombre}</option>`;
                
                let fHtml = "";
                if(r.archivos) {
                    Object.keys(r.archivos).forEach(idF => {
                        const f = r.archivos[idF];
                        // Limpieza simple de link para visualización
                        const dLink = f.link;
                        fHtml += `<div class="archivo"><a href="${dLink}" target="_blank">?? ${f.nombre}</a></div>`;
                        
                        g.innerHTML += `<div class="edit-item">
                            <span class="clic-edit" onclick="upF('${idR}','${idF}','${f.nombre}','${f.link}')"> ${r.nombre} >  ${f.nombre}</span>
                            <button class="btn-x" onclick="delF('${idR}','${idF}')">Eliminar</button>
                        </div>`;
                    });
                }
                v.innerHTML += `<div class="rama"><div class="rama-t">${r.nombre}</div>${fHtml}</div>`;
                g.innerHTML += `<div class="edit-item">
                    <b class="clic-edit" onclick="upR('${idR}','${r.nombre}')">CARPETA: ${r.nombre}</b>
                    <button class="btn-x" onclick="delR('${idR}')">Eliminar Carpeta</button>
                </div>`;
            });
        } else {
            v.innerHTML = "<p style='color:#666;'>No hay datos para mostrar.</p>";
        }
    } catch (e) { 
        console.error("Error:", e);
        document.getElementById('visor').innerHTML = "Error al conectar con la base de datos.";
    }
}

function val() { 
    const pass = prompt("Introduce la clave de administrador:");
    return pass === KEY; 
}

function verG() { 
    if(val()) document.getElementById('gestion').style.display = "block"; 
}

function upR(id, n) {
    document.getElementById('editIdR').value = id;
    document.getElementById('rn').value = n;
    window.scrollTo({top: document.body.scrollHeight, behavior: 'smooth'});
}

function upF(idR, idF, n, l) {
    document.getElementById('rd').value = idR;
    document.getElementById('editIdF').value = idF;
    document.getElementById('fn').value = n;
    document.getElementById('fl').value = l;
    window.scrollTo({top: document.body.scrollHeight, behavior: 'smooth'});
}

async function saveR() {
    const id = document.getElementById('editIdR').value;
    const n = document.getElementById('rn').value;
    if(!n) return alert("Escribe un nombre");
    if(!val()) return;
    
    const met = id ? 'PATCH' : 'POST';
    const url = id ? `${URL_BASE}/${id}.json` : `${URL_BASE}.json`;
    await fetch(url, { method: met, body: JSON.stringify({nombre: n}) });
    reset(); load();
}

async function saveF() {
    const idR = document.getElementById('rd').value;
    const idF = document.getElementById('editIdF').value;
    const n = document.getElementById('fn').value;
    const l = document.getElementById('fl').value;
    if(!idR || !n || !l) return alert("Completa todos los campos");
    if(!val()) return;

    const met = idF ? 'PATCH' : 'POST';
    const url = idF ? `${URL_BASE}/${idR}/archivos/${idF}.json` : `${URL_BASE}/${idR}/archivos.json`;
    await fetch(url, { method: met, body: JSON.stringify({nombre: n, link: l}) });
    reset(); load();
}

function reset() {
    document.getElementById('editIdR').value = ""; 
    document.getElementById('editIdF').value = "";
    document.getElementById('rn').value = ""; 
    document.getElementById('fn').value = ""; 
    document.getElementById('fl').value = "";
}

async function delR(id) { 
    if(confirm("¿Borrar carpeta y todo su contenido?") && val()) { 
        await fetch(`${URL_BASE}/${id}.json`, { method:'DELETE' }); 
        load(); 
    } 
}

async function delF(idR, idF) { 
    if(confirm("¿Borrar este archivo?") && val()) { 
        await fetch(`${URL_BASE}/${idR}/archivos/${idF}.json`, { method:'DELETE' }); 
        load(); 
    } 
}
</script>
</body>
</html>
