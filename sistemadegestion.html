<!DOCTYPE HTML PUBLIC "-//W3C//DTD HTML 4.01 Transitional//EN" "http://www.w3.org/TR/html4/loose.dtd">
<html>
<head>
<meta http-equiv="Content-Type" content="text/html; charset=iso-8859-1">
<title>INCOREA CABLES</title>
<link href="estilos.css" rel="stylesheet" type="text/css">
<style>
    body { font-family: sans-serif; background: #0e161d; color: white; margin: 0; }
    .container { margin: 20px 5%; min-height: 300px; }
    
    /* VISTA PÚBLICA - SECCIÓN PRODUCTOS EN 3 COLUMNAS */
    .seccion-titulo { 
        color: #1abc9c; 
        font-size: 20px; 
        font-weight: bold; 
        border-bottom: 2px solid #1abc9c; 
        padding-bottom: 8px; 
        margin-bottom: 20px;
    }

    .grid-productos {
        display: grid;
        grid-template-columns: repeat(3, 1fr);
        gap: 20px;
        margin-bottom: 40px;
    }

    /* Tarjetas de Productos */
    .card-producto {
        background: #16222f;
        border: 1px solid #1a252f;
        border-radius: 6px;
        overflow: hidden;
        transition: transform 0.3s, border-color 0.3s;
        display: flex;
        flex-direction: column;
    }
    .card-producto:hover {
        transform: translateY(-4px);
        border-color: #1abc9c;
    }
    .card-producto img {
        width: 100%;
        height: 180px;
        object-fit: cover;
        background-color: #0b1117;
    }
    .card-info {
        padding: 12px;
        flex-grow: 1;
        display: flex;
        flex-direction: column;
        justify-content: space-between;
    }
    .card-titulo {
        font-size: 15px;
        font-weight: bold;
        color: #ffffff;
        margin-bottom: 6px;
    }
    .card-desc {
        font-size: 13px;
        color: #1abc9c;
        margin-bottom: 8px;
    }

    /* ARCHIVOS Y DOCUMENTOS */
    .archivo { padding: 8px 0 8px 20px; border-left: 1px solid #1abc9c33; margin: 5px 0; }
    .archivo a { color: #eee; text-decoration: none; font-size: 15px; }
    .archivo a:hover { color: #1abc9c; }

    /* PANEL ADMIN */
    .admin-zona { 
        background: rgba(255, 255, 255, 0.02);
        padding: 20px 5%; 
        border-top: 1px solid #1a252f; 
        margin-top: 60px; 
        transition: 0.5s;
    }
    .admin-zona:hover {
        background: rgba(255, 255, 255, 0.05);
    }

    .inputs { display: flex; gap: 8px; flex-wrap: wrap; margin-bottom: 12px; justify-content: center; }
    
    input, select { 
        background: transparent; 
        border: 1px solid #333; 
        color: #888; 
        padding: 6px 10px; 
        border-radius: 4px; 
        font-size: 11px; 
        outline: none; 
    }
    input:focus { border-color: #1abc9c; color: white; }

    button { 
        background: transparent; 
        border: 1px solid #1abc9c; 
        color: #1abc9c; 
        padding: 6px 12px; 
        cursor: pointer; 
        border-radius: 4px; 
        font-size: 10px; 
        transition: 0.3s; 
    }
    button:hover { background: #1abc9c; color: #0e161d; }
    
    /* GESTIÓN */
    #gestion { 
        display: none; 
        margin-top: 20px; 
        border-top: 1px dashed #222; 
        padding-top: 15px; 
        max-width: 800px; 
        margin: 20px auto; 
    }
    .edit-item { display: flex; justify-content: space-between; padding: 6px 0; font-size: 11px; border-bottom: 1px solid #1a252f; align-items: center; color: #666; }
    .clic-edit { cursor: pointer; flex: 1; }
    .clic-edit:hover { color: #1abc9c; }
    .btn-x { 
        background: transparent; 
        border: 1px solid #e74c3c; 
        color: #e74c3c; 
        padding: 2px 6px; 
        font-size: 9px; 
    }
    .btn-x:hover { background: #e74c3c; color: white; }

    /* Adaptabilidad a pantallas pequeñas (móviles) */
    @media (max-width: 768px) {
        .grid-productos {
            grid-template-columns: 1fr;
        }
    }
</style>
</head>

<body>
<div id="wrapper">
    <div id="header">
        <div id="logo-container"><img src="logo de la empresa.png" id="logo-imagen" alt="Logo"></div>
        <div id="titulo-container">
            <h1>INCOREA CABLES</h1>
            <p>Directorio de Documentación y Productos</p>
        </div>
    </div>

    <div id="nav">
        <a href="index.html">INICIO</a>
        <a href="directorio.html">DIRECTORIO</a>
        <a href="sistemadegestion.html">SISTEMA DE GESTIÓN</a>
        <a href="global.html">GLOBAL</a>
        <a href="otros.html">OTROS</a>
        <a href="contactos.html">CONTACTOS</a>
    </div>

    <div class="container">
        <!-- VISTA DE PRODUCTOS EN FILA DE 3 -->
        <div class="seccion-titulo">CATÁLOGO DE PRODUCTOS</div>
        <div class="grid-productos" id="gridProductos">
            <!-- Los productos se cargarán dinámicamente aquí -->
        </div>

        <!-- VISOR DE DOCUMENTOS -->
        <div class="seccion-titulo">DOCUMENTOS Y ARCHIVOS</div>
        <div id="visor"></div>
    </div>

    <!-- PANEL ADMIN (Sin opción de carpetas) -->
    <div class="admin-zona">
        <!-- AGREGAR PRODUCTO -->
        <div class="inputs">
            <input type="hidden" id="editIdProd">
            <input type="text" id="pNombre" placeholder="Nombre del Producto">
            <input type="text" id="pImg" placeholder="Link de Imagen (URL)">
            <input type="text" id="pDetalle" placeholder="Detalle / Precio">
            <button onclick="saveProducto()">GUARDAR PRODUCTO</button>
            <button onclick="verG()" style="background:#444">GESTIONAR / EDITAR</button>
        </div>
        
        <!-- AGREGAR ARCHIVO -->
        <div class="inputs">
            <input type="hidden" id="editIdF"> 
            <input type="text" id="fn" placeholder="Nombre del Archivo">
            <input type="text" id="fl" placeholder="Link de OneDrive">
            <button onclick="saveF()">GUARDAR ARCHIVO</button>
        </div>

        <div id="gestion">
            <p style="color:#1abc9c; font-size: 11px; text-align: center; margin-bottom: 10px;">
                TOCA UN ELEMENTO PARA EDITARLO
            </p>
            <div id="listaG"></div>
        </div>
    </div>
    
    <div id="footer">
        <p>&copy;INCOREA CABLES</p>
    </div>
</div>

<script>
const URL = "https://httpsincorea-cables-default-rtdb.firebaseio.com/sistemaServicios";
const KEY = "1234"; // Tu clave de acceso

window.onload = load;

async function load() {
    const res = await fetch(`${URL}.json`);
    const data = await res.json() || {};
    
    const gridProd = document.getElementById('gridProductos');
    const v = document.getElementById('visor');
    const g = document.getElementById('listaG');
    
    gridProd.innerHTML = "";
    v.innerHTML = ""; 
    g.innerHTML = "";

    // 1. Cargar Productos (Fila de 3)
    if(data.productos) {
        Object.keys(data.productos).forEach(idP => {
            const p = data.productos[idP];
            gridProd.innerHTML += `
                <div class="card-producto">
                    <img src="${p.imagen || 'https://via.placeholder.com/300x180?text=Sin+Imagen'}" alt="${p.nombre}">
                    <div class="card-info">
                        <div class="card-titulo">${p.nombre}</div>
                        <div class="card-desc">${p.detalle || ''}</div>
                    </div>
                </div>
            `;
            
            // Item para el panel de gestión
            g.innerHTML += `
                <div class="edit-item">
                    <span class="clic-edit" onclick="upProducto('${idP}','${p.nombre}','${p.imagen || ''}','${p.detalle || ''}')">
                        📦 Producto: ${p.nombre} (Editar)
                    </span>
                    <button class="btn-x" onclick="delProducto('${idP}')">x</button>
                </div>
            `;
        });
    } else {
        gridProd.innerHTML = "<p style='color:#666; grid-column: 1/-1;'>No hay productos registrados.</p>";
    }

    // 2. Cargar Archivos
    if(data.archivos) {
        Object.keys(data.archivos).forEach(idF => {
            const f = data.archivos[idF];
            const dLink = f.link.split('?')[0].replace("redir", "download") + "?download=1";
            
            v.innerHTML += `<div class="archivo"><a href="${dLink}" target="_self">📄 ${f.nombre}</a></div>`;
           
            g.innerHTML += `
                <div class="edit-item">
                    <span class="clic-edit" onclick="upF('${idF}','${f.nombre}','${f.link}')">
                        📄 Archivo: ${f.nombre} (Editar)
                    </span>
                    <button class="btn-x" onclick="delF('${idF}')">x</button>
                </div>
            `;
        });
    } else {
        v.innerHTML = "<p style='color:#666;'>No hay archivos registrados.</p>";
    }
}

function val() { return prompt("Introduce la clave de administrador:") === KEY; }

function verG() { if(val()) document.getElementById('gestion').style.display = "block"; }

// Guardar/Actualizar Producto
async function saveProducto() {
    const idP = document.getElementById('editIdProd').value;
    const nombre = document.getElementById('pNombre').value;
    const imagen = document.getElementById('pImg').value;
    const detalle = document.getElementById('pDetalle').value;

    if(!nombre) return alert("Escribe el nombre del producto");
    if(!val()) return;

    const met = idP ? 'PATCH' : 'POST';
    const url = idP ? `${URL}/productos/${idP}.json` : `${URL}/productos.json`;
    await fetch(url, { method: met, body: JSON.stringify({ nombre, imagen, detalle }) });
    reset(); load();
}

// Guardar/Actualizar Archivo
async function saveF() {
    const idF = document.getElementById('editIdF').value;
    const n = document.getElementById('fn').value;
    const l = document.getElementById('fl').value;

    if(!n || !l) return alert("Completa los datos del archivo");
    if(!val()) return;

    const met = idF ? 'PATCH' : 'POST';
    const url = idF ? `${URL}/archivos/${idF}.json` : `${URL}/archivos.json`;
    await fetch(url, { method: met, body: JSON.stringify({ nombre: n, link: l }) });
    reset(); load();
}

// Cargar Producto arriba para editar
function upProducto(id, nombre, imagen, detalle) {
    document.getElementById('editIdProd').value = id;
    document.getElementById('pNombre').value = nombre;
    document.getElementById('pImg').value = imagen;
    document.getElementById('pDetalle').value = detalle;
    window.scrollTo(0, document.body.scrollHeight);
}

// Cargar Archivo arriba para editar
function upF(idF, n, l) {
    document.getElementById('editIdF').value = idF;
    document.getElementById('fn').value = n;
    document.getElementById('fl').value = l;
    window.scrollTo(0, document.body.scrollHeight);
}

function reset() {
    document.getElementById('editIdProd').value = "";
    document.getElementById('pNombre').value = "";
    document.getElementById('pImg').value = "";
    document.getElementById('pDetalle').value = "";
    document.getElementById('editIdF').value = "";
    document.getElementById('fn').value = "";
    document.getElementById('fl').value = "";
}

async function delProducto(id) { 
    if(confirm("¿Borrar este producto?") && val()) { 
        await fetch(`${URL}/productos/${id}.json`, { method:'DELETE' }); 
        load(); 
    } 
}

async function delF(idF) { 
    if(confirm("¿Borrar este archivo?") && val()) { 
        await fetch(`${URL}/archivos/${idF}.json`, { method:'DELETE' }); 
        load(); 
    } 
}
</script>
</body>
</html>
